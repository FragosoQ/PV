<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOMENGIL · PS1</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --cyan:  #00d4ff;
  --green: #00ff87;
  --amber: #ffaa00;
  --red:   #ff3b3b;
  --bg:    #03060d;

  /* Alturas de referência — centralizam os números mágicos */
  --header-h: clamp(52px, 6vh, 70px);
  --footer-h: clamp(46px, 5.5vh, 60px);
  --side-pad: clamp(20px, 3vw, 48px);
}

html, body {
  width: 100%; height: 100%;
  background: radial-gradient(circle at center, rgba(81,184,234,1) 0%, rgba(0,0,0,1) 100%);
  background-attachment: fixed;
  color: #fff;
  font-family: 'Barlow Condensed', sans-serif;
  overflow-x: hidden;
  overflow-y: auto;
}

/* ══════════════════════════════════════
   LAYOUT
══════════════════════════════════════ */
.shell {
  display: grid;
  grid-template-rows: var(--header-h) 1fr var(--footer-h);
  height: 100vh;
  height: 100dvh; /* usa dvh quando disponível para evitar saltos em mobile */
  position: relative;
  min-height: 0;
}

/* ══════════════════════════════════════
   BACKGROUND TEXTURE
══════════════════════════════════════ */
.bg-grid {
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
  background-size: 48px 48px;
  pointer-events: none;
  z-index: 0;
}

.bg-glow-left {
  position: fixed;
  left: -200px; top: 20%;
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(255,255,255,0.06) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

.bg-glow-right {
  position: fixed;
  right: -100px; bottom: 10%;
  width: 500px; height: 500px;
  background: radial-gradient(circle, rgba(0,80,120,0.15) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

/* ══════════════════════════════════════
   HEADER
══════════════════════════════════════ */
header {
  position: relative; z-index: 2;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 var(--side-pad);
  background: rgba(0,20,40,0.35);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(255,255,255,0.15);
  min-height: 0;
}

.h-logo {
  display: flex; align-items: center; gap: 14px;
}
.h-logo img { height: clamp(26px, 4vh, 36px); width: auto; display: block; }

.h-brand {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(24px, 3vh, 36px);
  letter-spacing: 6px; color: #fff;
  text-shadow: 0 0 30px rgba(255,255,255,0.3);
}

.h-center {
  position: absolute; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: clamp(10px, 1.5vw, 20px);
}

.h-badge {
  font-size: clamp(12px, 1.6vh, 16px); font-weight: 700; letter-spacing: 4px;
  text-transform: uppercase; color: rgba(255,255,255,0.75);
  white-space: nowrap;
}

.h-sep { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,0.4); flex-shrink: 0; }

.h-op {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(18px, 2.6vh, 26px); letter-spacing: 3px; color: #fff;
  text-shadow: 0 0 20px rgba(255,255,255,0.5);
  white-space: nowrap;
}

.h-time {
  font-size: clamp(14px, 2vh, 20px); letter-spacing: 2px; color: rgba(255,255,255,0.85);
  white-space: nowrap;
}

.h-priority {
  position: absolute;
  top: clamp(8px, 1.4vh, 14px);
  right: clamp(10px, 1.5vw, 18px);
  z-index: 3;
  display: flex; flex-direction: column; align-items: flex-end;
  line-height: 1.05;
  padding: 4px 10px;
  border-left: 2px solid rgba(255, 255, 255, 0.5);
  border-right: 2px solid rgba(255, 255, 255, 0.5);
  background: rgba(255, 255, 255, 0.05);
}
.h-priority[hidden] { display: none !important; }
.h-priority-label {
  font-size: clamp(9px, 1.2vh, 12px);
  font-weight: 700; letter-spacing: 3px;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.85);
  margin-bottom: 1.5em; /* Isto cria o espaço de "um parágrafo" entre os dois */
}
.h-priority-value {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(14px, 2.2vh, 22px);
  letter-spacing: 2px;
  color: #fff;
  text-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
  white-space: nowrap;
}
.h-priority.is-empty .h-priority-value {
  color: rgba(255,255,255,0.4);
  text-shadow: none;
}

/* Variante esquerda: posicionada no canto superior esquerdo */
.h-priority-left {
  right: auto;
  left: clamp(10px, 1.5vw, 18px);
  align-items: center;
}

/* ══════════════════════════════════════
   MAIN
══════════════════════════════════════ */
main {
  position: relative; z-index: 2;
  display: grid;
  grid-template-columns: 1fr clamp(340px, 32vw, 475px);
  gap: 0;
  overflow: hidden;
  min-height: 0;
  min-width: 0;
}

/* ══════════════════════════════════════
   LEFT PANEL
   Mudança principal: em vez de 1.2fr / 1px / 0.8fr (que pode esmagar zonas),
   as zonas recebem auto (pelo conteúdo) e o hero recebe 1fr (enche o resto).
   Assim, quando a altura encolhe, é o hero que encolhe primeiro — e nunca as zonas.
══════════════════════════════════════ */
.left {
  display: grid;
  /* 2 colunas: globo (ocupa toda a altura) | identidade + zonas */
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  grid-template-rows: minmax(0, 1fr) 1px auto;
  border-right: 1px solid rgba(255,255,255,0.12);
  min-height: 0;
  min-width: 0;
}

/* O .hero deixa de ser um grid próprio: os filhos passam a ser itens do .left */
.left > .hero { display: contents; }
.left > .hero > .hero-evolucao { grid-column: 1; grid-row: 1 / -1; }
.left > .hero > .hero-id       { grid-column: 2; grid-row: 1; margin-top: 12px; }
.left > .divider-h             { grid-column: 2; grid-row: 2; }
/* O canvas do globo não deve influenciar o tamanho da grelha */
#globeContainer > canvas { position: absolute; inset: 0; }
.left > .zonas-panel           { grid-column: 2; grid-row: 3; }

.divider-h { background: rgba(255,255,255,0.1); }

/* TOP LEFT — HERO */
.hero {
  display: grid;
  grid-template-columns: 1fr 1fr;
  overflow: hidden;
  min-height: 0;
}

.hero-evolucao {
  padding: clamp(16px, 3vh, 32px) clamp(20px, 3vw, 40px);
  display: flex;
  flex-direction: column;
  justify-content: center;
  border-right: 1px solid rgba(255,255,255,0.08);
  position: relative;
  overflow: visible;
  background: rgba(0,20,50,0.2);
  min-height: 0;
  min-width: 0;
}

.hero-evolucao::before {
  content: '';
  position: absolute;
  left: -20px; top: -20px;
  width: 200px; height: 200px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.08);
}
.hero-evolucao::after {
  content: '';
  position: absolute;
  left: -60px; top: -60px;
  width: 320px; height: 320px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.04);
}

.ev-label {
  font-size: 16px; font-weight: 700; letter-spacing: 5px;
  text-transform: uppercase; color: rgba(255,255,255,0.75);
  margin-bottom: 8px; position: relative; z-index: 1;
}

.ev-number {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(120px, 15vw, 200px);
  line-height: .85;
  letter-spacing: -2px;
  position: relative; z-index: 1;
}

.ev-sub {
  font-size: 18px; letter-spacing: 4px;
  color: rgba(255,255,255,0.75);
  text-transform: uppercase;
  margin-top: 12px; position: relative; z-index: 1;
}

/* HERO RIGHT — IDENTIDADE
   Fontes reduzidas e fluidas para poupar altura vertical.
*/
.hero-id {
  padding: clamp(16px, 3vh, 32px) clamp(20px, 3vw, 40px);
  display: flex; flex-direction: column; justify-content: center;
  gap: 0;
  background: rgba(0,10,30,0.15);
  min-height: 0;
  min-width: 0;
  overflow: hidden;
}

.id-modelo-label,
.id-cliente-label {
  font-size: clamp(18px, 2.4vh, 32px);
  font-weight: 700; letter-spacing: 5px;
  text-transform: uppercase; color: rgba(255,255,255,0.7);
  margin-bottom: clamp(4px, 0.8vh, 10px);
}

.id-modelo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(42px, 5.5vw, 92px);
  letter-spacing: 2px; color: #fff;
  line-height: 1;
  margin-bottom: clamp(4px, 0.8vh, 8px);
}

.posto-numero {
  position: absolute;
  top: clamp(10px, 1.5vh, 20px);
  right: clamp(12px, 1.5vw, 20px);
  z-index: 1;
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(42px, 5.5vw, 92px);
  letter-spacing: 2px;
  color: rgba(255, 255, 255, 0.85);
  line-height: 1;
  text-shadow: 0 0 24px rgba(255, 255, 255, 0.45);
}

.id-lote {
  font-size: clamp(22px, 3.6vh, 46px);
  color: rgba(255,255,255,0.8);
  letter-spacing: 1px;
  margin-bottom: clamp(14px, 3vh, 36px);
}

/* Tickets no cartão principal (sem scroll):
   1 ticket  → grande, objetivo por baixo
   2 tickets → um por linha
   3–8       → grelha 4 colunas × 2 linhas (o 8.º lugar vira "+N" se houver mais) */
.id-tickets {
  --t-id: clamp(32px, 4.2vw, 72px);
  --t-obj: clamp(20px, 3.2vh, 44px);
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: clamp(6px, 1.2vh, 14px) clamp(12px, 1.5vw, 24px);
  margin-top: calc(-1 * clamp(8px, 2vh, 26px));
  margin-bottom: clamp(14px, 3vh, 36px);
  min-width: 0;
  overflow: hidden;
}
.id-tickets[data-layout="stack"] {
  --t-id: clamp(24px, 2.8vw, 48px);
  --t-obj: clamp(15px, 2.2vh, 28px);
}
.id-tickets[data-layout="grid"] {
  --t-id: clamp(18px, 2vw, 36px);
  --t-obj: clamp(12px, 1.7vh, 22px);
  grid-template-columns: repeat(4, minmax(0, 1fr));
}
.ticket-row {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: clamp(2px, 0.5vh, 8px);
}
.id-tickets[data-layout="stack"] .ticket-row,
.id-tickets[data-layout="grid"] .ticket-row {
  flex-direction: row;
  align-items: baseline;
  gap: 0.6em;
  padding-left: 0.6em;
  border-left: 3px solid #ffd400;
}
.id-tickets[data-layout="grid"] .ticket-row {
  flex-direction: column;
  gap: 2px;
}
.ticket-row.ticket-more {
  justify-content: center;
  border-left-color: rgba(255,255,255,0.3) !important;
}
.id-ticket {
  font-family: 'Bebas Neue', sans-serif;
  font-size: var(--t-id);
  letter-spacing: 2px; color: #fff;
  line-height: 1;
  flex: 0 0 auto;
}
.id-ticket-modelo {
  margin-left: 0.4em;
  font-size: 0.6em;
  letter-spacing: 1px;
  color: #ffd400;
  vertical-align: middle;
}
.id-ticket-obj {
  font-size: var(--t-obj);
  font-weight: 700;
  letter-spacing: 1px;
  color: rgba(255,255,255,0.85);
  line-height: 1.15;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.id-tickets[data-layout="single"] .id-ticket-obj {
  white-space: normal;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}
@media (max-width: 900px) {
  .id-tickets[data-layout="grid"] { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

.id-cliente {
  font-size: clamp(21.42px, 2.45vw, 48.96px);
  font-weight: 700;
  text-transform: uppercase; letter-spacing: 1px;
  color: #fff; line-height: 1.1;
  margin-bottom: clamp(4px, 0.8vh, 10px);
}

.id-pais {
  display: flex; align-items: center; gap: clamp(8px, 1vw, 14px);
}
.id-flag {
  font-size: clamp(32px, 5vh, 64px);
  line-height: 1;
}
.id-pais-info {
  font-size: clamp(20px, 3.2vh, 44px);
  letter-spacing: 2px;
  color: rgba(255,255,255,0.8); text-transform: uppercase;
}

/* Modo grid 2x2 quando há mais do que um país */
.id-pais.is-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: clamp(6px, 1vh, 12px) clamp(14px, 2vw, 28px);
  align-items: center;
}
.id-pais-cell {
  display: flex;
  align-items: center;
  gap: clamp(6px, 0.8vw, 10px);
  min-width: 0;
}
.id-pais-cell .id-flag {
  font-size: clamp(24px, 3.6vh, 43px);
  flex-shrink: 0;
}
.id-pais-cell .id-pais-info {
  font-size: clamp(17px, 2.4vh, 29px);
  letter-spacing: 1.5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* BOTTOM LEFT — ZONAS
   Paddings e fontes agora fluidos para garantir que cabem sempre.
*/
.zonas-panel {
  padding: clamp(14px, 2.4vh, 28px) clamp(20px, 3vw, 40px);
  display: flex; flex-direction: column; gap: 0;
  background: rgba(0,15,40,0.2);
  min-height: 0;
  min-width: 0;
}

.zonas-title {
  font-size: clamp(16px, 2.2vh, 22px);
  font-weight: 700; letter-spacing: 5px;
  text-transform: uppercase; color: rgba(255,255,255,0.75);
  margin-bottom: clamp(10px, 1.6vh, 16px);
}

.zonas-grid {
  display: grid;
  /* 2 colunas: Planeamento (-2%) | Histórico/Prox.Pri (+2%) */
  grid-template-columns: 0.92fr 1.08fr;
  grid-auto-rows: 1fr;
  gap: clamp(10px, 1.6vh, 16px) clamp(14px, 2vw, 24px);
  flex: 1;
  min-height: 0;
}

.zona-card {
  display: flex; flex-direction: column;
  gap: clamp(4px, 0.8vh, 8px);
  padding: clamp(10px, 1.6vh, 16px) clamp(12px, 1.4vw, 18px);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 10px;
  background: rgba(255,255,255,0.07);
  backdrop-filter: blur(8px);
  position: relative;
  overflow: hidden;
  transition: border-color .3s, background .3s;
  min-width: 0;
}

.zona-card.done  { border-color: rgba(0,255,135,0.4);  background: rgba(0,255,135,0.08); }
.zona-card.going { border-color: rgba(255,255,255,0.25); background: rgba(255,255,255,0.1); }
.zona-card.empty { border-color: rgba(255,255,255,0.06); background: rgba(0,0,0,0.15); }

/* Card que ocupa 2 linhas do grid (ex: Planeamento, Testes) */
.zona-card.tall { grid-row: span 2; }

.zona-card-label {
  font-size: clamp(14px, 1.8vh, 22px);
  font-weight: 700; letter-spacing: 3px;
  text-transform: uppercase; color: rgba(255,255,255,0.75);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.zona-card.done  .zona-card-label { color: #00ff87; }
.zona-card.going .zona-card-label { color: #fff; }
.zona-card.empty .zona-card-label { color: rgba(255,255,255,0.4); }

.zona-card-pct {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(38px, 6vh, 72px);
  line-height: 1; letter-spacing: 1px;
}

.zona-card-bar {
  height: clamp(6px, 1vh, 10px);
  background: rgba(255,255,255,0.12);
  border-radius: 5px; overflow: hidden;
}
.zona-card-fill { height: 100%; border-radius: 5px; }

/* Variante: card em modo lista (ex: Área Técnica → últimos lotes em soldadura) */
.zona-card.list {
  gap: clamp(2px, 0.4vh, 4px);
  justify-content: flex-start;
}
.zona-card.list .zona-card-label {
  margin-bottom: clamp(2px, 0.4vh, 4px);
}
.zona-card-list-header {
  font-size: clamp(10px, 1.2vh, 12px);
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.5);
  padding-bottom: clamp(2px, 0.4vh, 4px);
  border-bottom: 1px solid rgba(255,255,255,0.1);
}
.zona-card-list-items {
  display: flex;
  flex-direction: column;
  gap: clamp(1px, 0.3vh, 3px);
  flex: 1;
  min-height: 0;
  overflow: hidden;
}

/* Variante: items em grid (ex: Histórico em 3×4) */
.zona-card-list-items.is-grid-list {
  display: grid;
  grid-template-columns: repeat(var(--grid-cols, 3), minmax(0, 1fr));
  grid-template-rows: repeat(var(--grid-rows, 4), 1fr);
  gap: clamp(2px, 0.5vh, 6px) clamp(6px, 1vw, 14px);
  align-items: center;
}
.zona-card-list-items.is-grid-list .zona-card-list-item {
  text-align: left;
  padding: 0 2px;
}
.zona-card-list-item {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: calc(clamp(23px, 1.7vh, 18px) * 1.1);
  font-weight: 600;
  color: rgba(255,255,255,0.9);
  letter-spacing: 0.5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.25;
}

/* Item destacado: corresponde ao modelo+lote actualmente em produção */
.zona-card-list-item.active {
  color: #fff;
  font-weight: 700;
  animation: list-item-glow 6s ease-in-out infinite;
}
@keyframes list-item-glow {
  0%, 100% {
    text-shadow:
      0 0 4px rgba(0, 212, 255, 0.5),
      0 0 8px rgba(0, 212, 255, 0.3);
  }
  50% {
    text-shadow:
      0 0 8px rgba(0, 212, 255, 0.95),
      0 0 18px rgba(0, 212, 255, 0.7),
      0 0 28px rgba(0, 212, 255, 0.4);
  }
}
.zona-card-list-item.dim {
  color: rgba(255,255,255,0.35);
}
.zona-card-list-empty {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: clamp(12px, 1.5vh, 16px);
  color: rgba(255,255,255,0.35);
  font-style: italic;
}

/* Variante: card com um único valor centrado (ex: Próxima Prioridade) */
.zona-card.single {
  justify-content: space-between;
}
.zona-card-single-value {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(28px, 5vh, 56px);
  letter-spacing: 1px;
  color: #fff;
  text-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
  line-height: 1;
  padding: 0 4px;
  min-height: 0;
  text-align: center;
  word-break: break-word;
}
.zona-card-single-sub {
  text-align: center;
  font-size: clamp(12px, 1.5vh, 16px);
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.55);
}

/* Itens de objetivos (Planeamento): título + status / meta */
.zona-card-list-items .zona-card-list-item.obj-item {
  white-space: normal;
  display: flex;
  flex-direction: column;
  gap: 1px;
  padding: clamp(2px, 0.4vh, 4px) 0;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.obj-item .obj-top {
  display: flex;
  align-items: baseline;
  gap: 0.5em;
  min-width: 0;
}
.obj-item .obj-id {
  flex: 0 0 auto;
  font-size: 0.7em;
  font-weight: 700;
  letter-spacing: 1px;
  color: rgba(255,255,255,0.55);
}
.obj-item .obj-title {
  flex: 1 1 auto;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.obj-item .obj-status {
  flex: 0 0 auto;
  font-size: 0.6em;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  padding: 1px 6px;
  border-radius: 4px;
  border: 1px solid rgba(0,212,255,0.5);
  color: #00d4ff;
}
.obj-item .obj-status.is-done { border-color: rgba(0,255,135,0.45); color: #00ff87; }
.obj-item .obj-status.is-late { border-color: rgba(255,90,90,0.6); color: #ff6b6b; }
.obj-item .obj-status.st-analise  { border-color: rgba(170,170,170,0.6); color: #b0b0b0; }
.obj-item .obj-status.st-agendado { border-color: rgba(0,150,255,0.6);   color: #3aa0ff; }
.obj-item .obj-status.st-curso    { border-color: rgba(255,210,0,0.6);   color: #ffd400; }

/* ══════════════════════════════════════
   RIGHT PANEL
══════════════════════════════════════ */
.right {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: rgba(0,10,30,0.25);
  backdrop-filter: blur(4px);

  min-width: 0;

/* GLOBO / EVOLUÇÃO */
.globe-section {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;

  border-bottom: 1px solid rgba(255,255,255,0.1);

  min-height: 0;
  padding: clamp(10px, 1.5vh, 20px) 0;

.globe-brand {

  font-family: 'Bebas Neue', sans-serif;

  letter-spacing: 2px;
  color: rgba(255,255,255,0.65);
  text-align: center;
  margin-bottom: clamp(8px, 1.5vh, 18px);
}
  

/* PRAZO */
.prazo-section {
  padding: clamp(14px, 2.2vh, 24px) clamp(18px, 2vw, 28px);
  border-bottom: 1px solid rgba(255,255,255,0.1);
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-height: 0;
}

.prazo-top {
  display: flex; justify-content: space-between; align-items: flex-end;
  margin-bottom: clamp(8px, 1.2vh, 12px);
  gap: 10px;
}

.prazo-label {
  font-size: clamp(13px, 1.6vh, 16px);
  font-weight: 700; letter-spacing: 5px;
  text-transform: uppercase; color: rgba(255,255,255,0.75);
}

.prazo-folga {
  font-size: clamp(14px, 1.8vh, 18px);
  letter-spacing: 2px;
  text-transform: uppercase;
  text-align: right;
}

.prazo-numbers {
  display: flex; align-items: baseline; gap: 6px;
  margin-bottom: clamp(10px, 1.4vh, 14px);
}
.prazo-used {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(52px, 8vh, 80px);
  line-height: .9; letter-spacing: -1px;
}
.prazo-div { font-size: clamp(24px, 3.6vh, 36px); color: rgba(255,255,255,0.4); font-weight: 300; }
.prazo-total { font-size: clamp(32px, 4.8vh, 48px); color: #fff; font-weight: 300; letter-spacing: -1px; }
.prazo-unit { font-size: clamp(14px, 1.8vh, 18px); letter-spacing: 3px; text-transform: uppercase; color: rgba(255,255,255,0.75); align-self: flex-end; padding-bottom: clamp(6px, 1vh, 10px); }

.prazo-track {
  height: clamp(8px, 1.2vh, 12px);
  background: rgba(255,255,255,0.12);
  border-radius: 6px; overflow: hidden;
}
.prazo-fill-bar {
  height: 100%;
  border-radius: 6px;
  position: relative;
  overflow: hidden;
}
.prazo-fill-bar::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 50%;
  background: rgba(255,255,255,0.2);
  border-radius: 6px 6px 0 0;
}
.prazo-hours {
  display: none;
  margin-top: clamp(8px, 1.1vh, 12px);
}
.prazo-hours-track {
  height: 5px;
  overflow: hidden;
  border-radius: 4px;
  background: rgba(255,255,255,0.12);
}
.prazo-hours-bar {
  width: 0;
  height: 100%;
  border-radius: 4px;
  transition: width .6s ease;
}

/* DETALHES */
.details-section {
  padding: clamp(12px, 1.8vh, 20px) clamp(18px, 2vw, 28px);

  justify-content: center;
  align-items: stretch;
  gap: 0;
  min-height: 0;
}
/* Agrupa os rows e mantém-nos coladinhos, centrados em bloco */

}

.detail-row {

}
.detail-row:last-child { border-bottom: none; }

.d-k {

}

/* ── Vários tickets: Evolução / Prazo / Datas por ticket ──

body.is-multi #evNum,

body.is-multi .prazo-numbers,
body.is-multi .prazo-track,

.multi-ev[hidden], .multi-prazo[hidden], .multi-details[hidden] { display: none; }

.multi-ev {
  display: grid;
  grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr));
  gap: clamp(6px, 1vh, 12px) clamp(12px, 1.5vw, 24px);
  width: 100%;
  padding: 0 clamp(12px, 1.5vw, 24px);
  overflow: hidden;
}
.multi-ev-item {
  display: flex; flex-direction: column; align-items: center;

}

  font-weight: 700; letter-spacing: 2px;

}

}

.multi-prazo, .multi-details {

}
.multi-prazo-item, .multi-details-item {

  color: #fff;

.multi-details-item { grid-template-columns: auto minmax(0, 1fr); }

/* ══════════════════════════════════════
   BREAK VIDEO (canto inferior esquerdo, 9:16, ciclo 36s ON / 2min OFF)
══════════════════════════════════════ */
.break-stage {
  position: fixed;
  left: 10vw;
  bottom: 0;
  height: 65vh;
  width: auto;             /* ajustado por JS quando o vídeo carrega */

}

}

.break-video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;

/* ══════════════════════════════════════
   MEDIA QUERIES — ajuste em ecrãs baixos
   Quando a altura da viewport é pequena (típico em 13" touchscreen
   industrial), encolhemos ainda mais o hero-id e damos prioridade às zonas.
══════════════════════════════════════ */
@media (max-height: 820px) {
  .hero-id { padding-top: 14px; padding-bottom: 14px; }
  .id-lote { margin-bottom: 14px; }
  .id-cliente-label { margin-top: 0 !important; }

  /* Labels de ID mais compactas */
  .id-modelo-label,
  .id-cliente-label { letter-spacing: 3px; }

  .hero-id { gap: 0; }
}

@media (max-height: 620px) {

  .id-lote { margin-bottom: 8px; }
  .zonas-grid { gap: 8px 12px; }
  .zona-card { padding: 8px 12px; }
  .zona-card-pct { font-size: clamp(32px, 5vh, 48px); }
}

}

<script>
const SHEET_CONFIG_DEFAULT = {
  id: '1GQUB52a2gKR429bjqJrNkbP5rjR7Z_4v85z9M7_Cr8Y',
  tab: 'PM1',
  keyHeader: null,
  keyValue: null,
  targetHeader: 'EVOLUÇÃO',
  targetColumn: 'Y',
};

// Cache system to avoid multiple fetches
let sheetCache = {};
let sheetCachePromises = {};

function getCacheKey(config) {
  const cfg = Object.assign({}, SHEET_CONFIG_DEFAULT, config);
  return `${cfg.id}|${cfg.tab}`;
}

function getSheetEndpoint(config) {
  const sheetId = encodeURIComponent(config.id);
  // `gid` (ex: 0 = primeiro separador) tem prioridade quando não há `tab`
  if (config.gid != null && !config.tab) {
    return `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&gid=${encodeURIComponent(config.gid)}&headers=1`;
  }
  const sheetTab = encodeURIComponent(config.tab);
  // Com `range` (ex: 'L22:M26') pede só esse bloco de células, sem linha de cabeçalho.
  if (config.range) {
    return `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&sheet=${sheetTab}&range=${encodeURIComponent(config.range)}&headers=0`;
  }
  return `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&sheet=${sheetTab}&headers=1`;
}

function parseGvizResponse(text) {
  const match = text.match(/google\.visualization\.Query\.setResponse\((.*)\);?$/s);
  if (!match) {
    throw new Error('Invalid Google Sheets response format');
  }
  return JSON.parse(match[1]);
}

function normalizeString(value) {
  return String(value || '').trim().normalize('NFC').toLowerCase();
}

function columnLetterToIndex(letter) {
  if (!letter) return -1;
  const normalized = String(letter).trim().toUpperCase();
  let index = 0;
  for (let i = 0; i < normalized.length; i += 1) {
    const charCode = normalized.charCodeAt(i);
    if (charCode < 65 || charCode > 90) {
      return -1;
    }
    index = index * 26 + (charCode - 65 + 1);
  }
  return index - 1;
}

function findSheetCell(table, headerLabel, fallbackColumn) {
  if (!table || !Array.isArray(table.cols)) {
    return -1;
  }

  // Prioritize column letter if provided
  if (fallbackColumn) {
    const fallbackIndex = columnLetterToIndex(fallbackColumn);
    if (fallbackIndex >= 0 && fallbackIndex < table.cols.length) {
      return fallbackIndex;
    }
  }

  // Fall back to header matching
  if (headerLabel) {
    const label = normalizeString(headerLabel);
    return table.cols.findIndex(col => normalizeString(col.label || col.id || '') === label);
  }

  return -1;
}

function getValueFromRow(row, index) {
  if (!row || !Array.isArray(row.c) || index < 0) {
    return null;
  }
  const cell = row.c[index];
  if (!cell) {
    return null;
  }
  return cell.v != null ? cell.v : (cell.f != null ? cell.f : null);
}

function findRowByKey(table, keyHeader, keyValue) {
  if (!Array.isArray(table.rows) || table.rows.length === 0) {
    return null;
  }
  if (keyHeader && keyValue) {
    const keyIndex = findSheetCell(table, keyHeader);
    if (keyIndex >= 0) {
      const found = table.rows.find(row => {
        const cellValue = getValueFromRow(row, keyIndex);
        return normalizeString(cellValue) === normalizeString(keyValue);
      });
      if (found) {
        return found;
      }
    }
  }
  return table.rows[0] || null;
}

function parseSheetPercentage(value) {
  if (value == null) {
    return null;
  }

  if (typeof value === 'number') {
    const pct = Math.abs(value) <= 1 ? value * 100 : value;
    return Math.round(pct);
  }

  const str = String(value).trim();
  const percentMatch = str.match(/^(-?\d+(?:[\.,]\d+)?)\s*%$/);
  if (percentMatch) {
    return Math.round(Number(percentMatch[1].replace(',', '.')));
  }

  const numericMatch = str.replace(/\s+/g, '').replace(',', '.').match(/(-?\d+(?:\.\d+)?)/);
  if (!numericMatch) {
    return null;
  }
  const numeric = Number(numericMatch[1]);
  const pct = numeric <= 1 ? numeric * 100 : numeric;
  return Math.round(pct);
}

function parseSheetDate(value) {
  if (value == null) {
    return null;
  }

  // Handle Google Sheets date format like "Date(2026,3,14)"
  const dateMatch = String(value).match(/Date\((\d+),(\d+),(\d+)\)/);
  if (dateMatch) {
    const year = parseInt(dateMatch[1]);
    const month = parseInt(dateMatch[2]); // 0-based in JS Date
    const day = parseInt(dateMatch[3]);
    const date = new Date(year, month, day);
    return date;
  }

  // Try to parse as regular date string
  const date = new Date(String(value));
  if (!isNaN(date.getTime())) {
    return date;
  }

  return null;
}

function formatSheetDate(value) {
  const date = parseSheetDate(value);
  if (!date) {
    return String(value);
  }
  return date.toLocaleDateString('pt-PT', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

function getDaysDiff(dateValue1, dateValue2) {
  const date1 = parseSheetDate(dateValue1);
  const date2 = parseSheetDate(dateValue2);
  
  if (!date1 || !date2) {
    return null;
  }

  // Reset time to midnight for accurate day difference
  date1.setHours(0, 0, 0, 0);
  date2.setHours(0, 0, 0, 0);

  return Math.floor((date2 - date1) / (1000 * 60 * 60 * 24));
}

async function fetchSheetTable(config) {
  const endpoint = getSheetEndpoint(config);
  const response = await fetch(endpoint, { cache: 'no-cache' });
  if (!response.ok) {
    throw new Error(`Sheet fetch failed: ${response.status} ${response.statusText}`);
  }
  const text = await response.text();
  const json = parseGvizResponse(text);
  if (!json || !json.table) {
    throw new Error('Sheet response did not contain table data');
  }
  return json.table;
}

function buildRowLookup(table, row) {
  const valuesByHeader = {};
  const valuesByColumn = {};

  if (!row || !Array.isArray(table.cols)) {
    return { valuesByHeader, valuesByColumn };
  }

  table.cols.forEach((col, index) => {
    const value = getValueFromRow(row, index);
    valuesByColumn[index] = value;

    const normalizedLabel = normalizeString(col.label || col.id || `col${index}`);
    valuesByHeader[normalizedLabel] = value;
  });

  return { valuesByHeader, valuesByColumn };
}

async function loadSheetDataCached(config = {}, options = {}) {
  const cfg = Object.assign({}, SHEET_CONFIG_DEFAULT, config);
  const cacheKey = getCacheKey(cfg);
  const forceReload = options.forceReload === true;

  if (!forceReload && sheetCache[cacheKey]) {
    return sheetCache[cacheKey];
  }

  if (!forceReload && sheetCachePromises[cacheKey]) {
    return await sheetCachePromises[cacheKey];
  }

  const promise = (async () => {
    const table = await fetchSheetTable(cfg);
    const row = findRowByKey(table, cfg.keyHeader, cfg.keyValue);
    if (!row) {
      throw new Error('No data row found in sheet');
    }

    const lookup = buildRowLookup(table, row);
    const result = { table, row, valuesByHeader: lookup.valuesByHeader, valuesByColumn: lookup.valuesByColumn };

    sheetCache[cacheKey] = result;
    delete sheetCachePromises[cacheKey];
    return result;
  })();

  sheetCachePromises[cacheKey] = promise;
  try {
    return await promise;
  } catch (error) {
    delete sheetCachePromises[cacheKey];
    throw error;
  }
}

async function loadSheetRow(config = {}) {
  const cached = await loadSheetDataCached(config);
  return cached;
}

function getSheetRowValue(rowData, targetHeader, targetColumn) {
  if (!rowData) {
    return null;
  }

  if (targetHeader) {
    const normalizedHeader = normalizeString(targetHeader);
    if (Object.prototype.hasOwnProperty.call(rowData.valuesByHeader, normalizedHeader)) {
      return rowData.valuesByHeader[normalizedHeader];
    }
  }

  if (targetColumn) {
    const index = columnLetterToIndex(targetColumn);
    if (index >= 0) {
      return rowData.valuesByColumn[index];
    }
  }

  return null;
}

async function loadSheetValue(config = {}) {
  const cfg = Object.assign({}, SHEET_CONFIG_DEFAULT, config);
  const cached = await loadSheetDataCached(cfg);

  return getSheetRowValue(cached, cfg.targetHeader, cfg.targetColumn);
}

function rowValuesSnapshot(rowData) {
  if (!rowData || !rowData.valuesByHeader) {
    return '';
  }
  const entries = Object.entries(rowData.valuesByHeader).sort(([a], [b]) => a.localeCompare(b));
  return JSON.stringify(entries);
}

// Watcher genérico de um separador inteiro: re-fetcha periodicamente e chama
// onChange sempre que o conteúdo da tabela mudar (snapshot por hash das células).
function watchSheetTab(config = {}, onChange, intervalMs = 20000) {
  const cfg = Object.assign({}, SHEET_CONFIG_DEFAULT, config);
  let lastSnapshot = null;
  let stopped = false;

  function tableSnapshot(table) {
    if (!table || !Array.isArray(table.rows)) return '';
    // Concatena valores brutos de todas as linhas/colunas
    const parts = [];
    for (let i = 0; i < table.rows.length; i += 1) {
      const row = table.rows[i];
      if (!row || !Array.isArray(row.c)) { parts.push(''); continue; }
      for (let j = 0; j < row.c.length; j += 1) {
        const cell = row.c[j];
        parts.push(cell ? (cell.v != null ? String(cell.v) : (cell.f != null ? String(cell.f) : '')) : '');
      }
      parts.push('|');
    }
    return parts.join(',');
  }

  async function check() {
    if (stopped) return;
    try {
      const table = await fetchSheetTable(cfg);
      const snapshot = tableSnapshot(table);
      if (snapshot !== lastSnapshot) {
        lastSnapshot = snapshot;
        onChange();
      }
    } catch (error) {
      console.warn(`Sheet watch error (${cfg.tab}):`, error);
    }
  }

  check();
  const intervalId = setInterval(check, intervalMs);
  return () => {
    stopped = true;
    clearInterval(intervalId);
  };
}

function watchSheetRow(config = {}, onChange, intervalMs = 20000) {
  let lastSnapshot = null;
  let stopped = false;

  async function check() {
    if (stopped) return;
    try {
      const cached = await loadSheetDataCached(config, { forceReload: true });
      const snapshot = rowValuesSnapshot(cached);
      if (snapshot !== lastSnapshot) {
        lastSnapshot = snapshot;
        onChange(cached);
      }
    } catch (error) {
      console.warn('Sheet watch error:', error);
    }
  }

  check();
  const intervalId = setInterval(check, intervalMs);
  return () => {
    stopped = true;
    clearInterval(intervalId);
  };
}

/**
 * Calcula dias úteis (segunda a sexta) entre duas datas em Portugal
 * @param {Date|String|Number} startDate - Data inicial
 * @param {Date|String|Number} endDate - Data final
 * @param {Boolean} includeStartDay - Se inclui o primeiro dia (padrão: true)
 * @param {Number} year - Ano para determinar feriados (padrão: ano da startDate)
 * @returns {Number} Número de dias úteis
 */
function getWorkDaysCount(startDate, endDate, includeStartDay = true, year = null) {
  const start = parseSheetDate(startDate);
  const end = parseSheetDate(endDate);
  
  if (!start || !end) {
    return null;
  }

  // Feriados nacionais em Portugal (formato: MM-DD)
  const ptHolidays = [
    '01-01', // Ano Novo
    '04-25', // Dia da Liberdade
    '05-01', // Dia do Trabalho
    '06-10', // Dia de Portugal
    '08-15', // Assunção
    '10-05', // Proclamação da República
    '11-01', // Dia de Todos os Santos
    '12-01', // Restauração da Independência
    '12-25', // Natal
  ];

  // Feriados móveis para 2026
  const mobileHolidays2026 = [
    '02-17', // Terça de Carnaval
    '04-17', // Sexta-feira Santa
  ];

  const year4Start = start.getFullYear();
  if (year === year4Start) {
    ptHolidays.push(...mobileHolidays2026);
  }

  const isHoliday = (date) => {
    const monthDay = String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0');
    return ptHolidays.includes(monthDay);
  };

  const isWorkDay = (date) => {
    const dayOfWeek = date.getDay();
    // 0 = domingo, 1 = segunda, ..., 5 = sexta, 6 = sábado
    return dayOfWeek >= 1 && dayOfWeek <= 5 && !isHoliday(date);
  };

  let count = 0;
  const current = new Date(start);
  current.setHours(0, 0, 0, 0);
  end.setHours(0, 0, 0, 0);

  // Ajestar se não inclui o dia de início
  if (!includeStartDay) {
    current.setDate(current.getDate() + 1);
  }

  while (current <= end) {
    if (isWorkDay(current)) {
      count++;
    }
    current.setDate(current.getDate() + 1);
  }

  return count;
}

function parseSheetTime(value) {
  if (value == null || String(value).trim() === '') {
    return null;
  }

  if (typeof value === 'number' && Number.isFinite(value)) {
    return value >= 0 && value < 1 ? value * 24 * 60 : null;
  }

  const text = String(value).trim();
  const dateMatch = text.match(/^Date\(\d+,\d+,\d+(?:,(\d+),(\d+),(\d+))?\)$/);
  const timeMatch = text.match(/(?:^|T)(\d{1,2}):(\d{2})(?::(\d{2}))?/);
  let hours;
  let minutes;
  let seconds;

  if (dateMatch) {
    hours = Number(dateMatch[1] || 0);
    minutes = Number(dateMatch[2] || 0);
    seconds = Number(dateMatch[3] || 0);
  } else if (timeMatch) {
    hours = Number(timeMatch[1]);
    minutes = Number(timeMatch[2]);
    seconds = Number(timeMatch[3] || 0);
  } else {
    return null;
  }

  if (hours > 23 || minutes > 59 || seconds > 59) {
    return null;
  }
  return hours * 60 + minutes + seconds / 60;
}

function getShiftHoursBetween(startMinutes, endMinutes) {
  const workPeriods = [[8 * 60, 12 * 60], [13 * 60, 17 * 60]];
  return workPeriods.reduce((total, [periodStart, periodEnd]) => {
    return total + Math.max(0, Math.min(endMinutes, periodEnd) - Math.max(startMinutes, periodStart));
  }, 0) / 60;
}

function getDeadlineHours(startDate, dueDate, startTime, now = new Date()) {
  const start = parseSheetDate(startDate);
  const due = parseSheetDate(dueDate);
  const startMinutes = parseSheetTime(startTime);
  if (!start || !due || startMinutes == null) {
    return null;
  }

  start.setHours(0, 0, 0, 0);
  due.setHours(0, 0, 0, 0);
  if (due < start) {
    return { elapsed: 0, total: 0 };
  }

  const currentTime = new Date(now);
  const today = new Date(currentTime);
  today.setHours(0, 0, 0, 0);
  const nowMinutes = currentTime.getHours() * 60 + currentTime.getMinutes() + currentTime.getSeconds() / 60;
  let elapsed = 0;
  let total = 0;

  for (const day = new Date(start); day <= due; day.setDate(day.getDate() + 1)) {
    if (getWorkDaysCount(day, day, true, start.getFullYear()) !== 1) {
      continue;
    }

    const isStartDay = day.getTime() === start.getTime();
    total += getShiftHoursBetween(isStartDay ? startMinutes : 0, 17 * 60);

    if (day < today) {
      elapsed += getShiftHoursBetween(isStartDay ? startMinutes : 0, 17 * 60);
    } else if (day.getTime() === today.getTime()) {
      elapsed += getShiftHoursBetween(isStartDay ? startMinutes : 0, nowMinutes);
    }
  }

  return { elapsed: Math.min(elapsed, total), total };
}

function formatWorkHours(hours) {
  return (Math.round(hours * 10) / 10).toLocaleString('pt-PT', { maximumFractionDigits: 1 });
}

/**
 * Retorna informações de prazo com dias úteis
 * @param {Date|String|Number} startDate - Data de início
 * @param {Date|String|Number} dueDate - Data prevista
 * @param {Date|String|Number} todayDate - Data atual (padrão: hoje)
 * @returns {Object} { totalWorkDays, remainingWorkDays, percentage }
 */
function getDeadlineInfo(startDate, dueDate, todayDate = new Date()) {
  const start = parseSheetDate(startDate);
  const due = parseSheetDate(dueDate);
  const today = parseSheetDate(todayDate);
  
  if (!start || !due || !today) {
    return null;
  }

  const totalWorkDays = getWorkDaysCount(start, due, true, start.getFullYear());
  const remainingWorkDays = getWorkDaysCount(today, due, false, today.getFullYear());
  
  return {
    totalWorkDays,
    remainingWorkDays,
    daysElapsed: totalWorkDays - remainingWorkDays,
    percentage: totalWorkDays > 0 ? Math.round(((totalWorkDays - remainingWorkDays) / totalWorkDays) * 100) : 0
  };
}

const ZONA_CONFIGS = [
  // Cards Cuba / Estrutura / Envolventes / Interior ocultados

// Cache simples para a lista de lotes — partilhado pelo refresh periódico
const ZONA_LIST_CACHE = {};

// Modelo+Lote actual (vindo do PS1!D2). Actualizado por refreshPs1Details.
// Usado para destacar o item correspondente nas listas (ex: Planeamento).
let currentModeloLote = null;

// Normaliza uma string para comparação de "modelo - lote":
// minúsculas, sem espaços extra à volta do "-", sem acentos.
function normalizeModeloLote(str) {
  return String(str || '')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .toLowerCase()
    .replace(/\s*-\s*/g, '-')   // "MWS500 SDS - 87L" → "mws500 sds-87l"
    .replace(/\s+/g, ' ')        // colapsa espaços múltiplos
    .trim();
}

// Percorre todos os itens das listas no DOM e marca como .active aqueles
// que correspondem ao modelo+lote actual. Idempotente — pode ser chamada
// quantas vezes for preciso.
function applyActiveHighlight() {
  const target = currentModeloLote ? normalizeModeloLote(currentModeloLote) : null;
  document.querySelectorAll('.zona-card-list-item:not(.cal-item)').forEach(el => {
    const match = target && normalizeModeloLote(el.textContent) === target;
    el.classList.toggle('active', !!match);
  });
}

function updateEvolucao(value) {
  const pct = Number.isFinite(value) ? value : FALLBACK_EV;
  evEl.textContent = `${pct}%`;
  evEl.style.color = ec(pct);
  evEl.style.textShadow = `0 0 60px ${ec(pct)}40`;
}

function getFieldValue(rowData, header, column, fallback = null) {
  const value = rowData ? getSheetRowValue(rowData, header, column) : null;
  if (value == null || (typeof value === 'string' && value.trim() === '')) {
    return fallback;
  }
  return value;
}

function renderText(el, value, fallback = '') {
  if (!el) return;
  el.textContent = value != null ? String(value) : fallback;
}

// Cartão principal: lista de tickets (ID + OBJETIVO). O tamanho adapta-se
// ao número de tickets via data-layout (ver CSS .id-tickets).
const ticketsEl = document.querySelector('.id-tickets');
function renderTickets(tickets) {
  if (!ticketsEl) return;
  const list = Array.isArray(tickets) ? tickets : [];
  ticketsEl.dataset.layout = list.length <= 1 ? 'single' : list.length === 2 ? 'stack' : 'grid';
  // Grelha 4×2: no máximo 8 lugares; se houver mais, o último mostra "+N"
  const MAX_TICKETS = 8;
  const shown = list.length > MAX_TICKETS ? list.slice(0, MAX_TICKETS - 1) : list;
  const extra = list.length - shown.length;
  // Modelo / Equipamento: coluna MODELO (H) dos tickets mostrados, sem repetidos
  const modelos = [...new Set(list.map(t => t.modelo).filter(Boolean))];
  renderText(modelEl, modelos.length ? modelos.join(' · ') : '—', '—');
  // País: coluna PAÍS (F) dos tickets mostrados, sem repetidos
  currentTicketPaises = [...new Set(list.map(t => t.pais).filter(Boolean))];
  renderPaisesFromTickets();
  updatePrazoFromTickets(list);
  ticketsEl.innerHTML = list.length
    ? shown.map(t => `<div class="ticket-row" title="${escapeHtml(t.value || '')}">
        <div class="id-ticket">${t.id ? `#${escapeHtml(t.id)}` : '—'}${t.modelo ? `<span class="id-ticket-modelo">${escapeHtml(t.modelo)}</span>` : ''}</div>
        <div class="id-ticket-obj">${escapeHtml(t.value || '—')}</div>
      </div>`).join('')
      + (extra > 0 ? `<div class="ticket-row ticket-more"><div class="id-ticket">+${extra}</div></div>` : '')
    : '<div class="ticket-row"><div class="id-ticket">—</div></div>';
}

// Prazo (Início / Previsto / dias) e % de evolução a partir dos tickets mostrados.
// Vários tickets: Início = DATA PEDIDO (C) mais antiga, Previsto = DATA PREVISTA (D)
// mais tardia; % = média dos tickets.
// % de cada ticket: coluna EVOLUÇÃO (I). Se estiver vazia: dias úteis decorridos /
// dias úteis totais × 90, no máximo 90%; 100% quando o STATUS é "Finalizado".
const EV_AUTO_MAX = 90;
function ticketPct(t) {
  // % vem da coluna EVOLUÇÃO (I); só se estiver vazia é que se calcula automaticamente
  if (t.evolucao != null) return t.evolucao;
  if (objStatusClass(t.status) === ' st-final') return 100;
  if (!t.pedidoDate || !t.prevDate) return 0;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  if (today < t.pedidoDate) return 0;
  if (today > t.prevDate) return EV_AUTO_MAX;
  const total = getWorkDaysCount(t.pedidoDate, t.prevDate, true);
  const used = getWorkDaysCount(t.pedidoDate, today, true);
  if (!total || used == null) return 0;
  return Math.max(0, Math.min(EV_AUTO_MAX, Math.round((used / total) * EV_AUTO_MAX)));
}

function updatePrazoFromTickets(list) {
  const fmt = d => d.toLocaleDateString('pt-PT', { day: '2-digit', month: '2-digit', year: 'numeric' });
  const DATE_PH = '-- / -- / ----';
  const starts = list.map(t => t.pedidoDate).filter(Boolean);
  const dues = list.map(t => t.prevDate).filter(Boolean);
  const start = starts.length ? new Date(Math.min(...starts)) : null;
  const due = dues.length ? new Date(Math.max(...dues)) : null;
  renderText(dataInicioEl, start ? fmt(start) : DATE_PH, DATE_PH);
  renderText(dataPrevistaEl, due ? fmt(due) : DATE_PH, DATE_PH);
  updateDeadline(start, due, null);

  const pct = list.length
    ? Math.round(list.reduce((sum, t) => sum + ticketPct(t), 0) / list.length)
    : 0;
  updateEvolucao(pct);
  renderMultiTickets(list, fmt);
}

// Vários tickets: mostra Evolução, Prazo e Datas de cada ticket (sem scroll).
// Até 4 tickets: 1 coluna no prazo/datas; 5+: 2 colunas.
const evMultiEl = document.getElementById('evMulti');
const prazoMultiEl = document.getElementById('prazoMulti');
const detailsMultiEl = document.getElementById('detailsMulti');

function ticketDeadline(t) {
  if (!t.pedidoDate || !t.prevDate) return null;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const total = getWorkDaysCount(t.pedidoDate, t.prevDate, true);
  const used = Math.max(0, getWorkDaysCount(t.pedidoDate, today, true) || 0);
  const remaining = getWorkDaysCount(today, t.prevDate, false);
  if (total == null || remaining == null) return null;
  const ratio = total > 0 ? Math.min(1, used / total) : 0;
  const isOverdue = used > total;
  const color = isOverdue ? '#ff3b3b' : ratio >= .7 ? '#ffaa00' : '#00ff87';
  const restColor = isOverdue ? '#ff3b3b' : remaining <= 3 ? '#ffaa00' : '#00ff87';
  return { total, used, remaining, ratio, color, restColor };
}

function renderMultiTickets(list, fmt) {
  const multi = list.length > 1;
  document.body.classList.toggle('is-multi', multi);
  [evMultiEl, prazoMultiEl, detailsMultiEl].forEach(el => { if (el) el.hidden = !multi; });
  if (!multi) return;

  const shown = list.slice(0, 8);
  const tid = t => `<span class="multi-tid">${t.id ? `#${escapeHtml(t.id)}` : '—'}</span>`;

  if (evMultiEl) {
    const cols = shown.length <= 2 ? shown.length : shown.length <= 4 ? 2 : 4;
    const rows = Math.ceil(shown.length / cols);
    evMultiEl.style.setProperty('--cols', cols);
    evMultiEl.style.setProperty('--ev-size', rows > 1
      ? (cols > 2 ? 'clamp(28px, 5vh, 70px)' : 'clamp(40px, 7vh, 100px)')
      : 'clamp(56px, 11vh, 160px)');
    evMultiEl.innerHTML = shown.map(t => {
      const p = ticketPct(t);
      return `<div class="multi-ev-item">
        <span class="multi-ev-id">#${escapeHtml(t.id || '—')}</span>
        <span class="multi-ev-pct" style="color:${ec(p)};text-shadow:0 0 40px ${ec(p)}40">${p}%</span>
      </div>`;
    }).join('');
  }

  const cols2 = shown.length > 4 ? 2 : 1;
  if (prazoMultiEl) {
    prazoMultiEl.style.setProperty('--cols', cols2);
    prazoMultiEl.innerHTML = shown.map(t => {
      const d = ticketDeadline(t);
      if (!d) return `<div class="multi-prazo-item">${tid(t)}<span class="multi-prazo-days">—</span><span></span></div>`;
      return `<div class="multi-prazo-item">
        ${tid(t)}
        <span class="multi-prazo-days" style="color:${d.color}">${d.used}<small> / ${d.total} dias</small></span>
        <span class="multi-prazo-rest" style="color:${d.restColor}">${d.remaining} dias restantes</span>
        <div class="multi-prazo-track"><div class="multi-prazo-bar" style="width:${d.ratio * 100}%;background:${d.color}"></div></div>
      </div>`;
    }).join('');
  }

  if (detailsMultiEl) {
    detailsMultiEl.style.setProperty('--cols', cols2);
    detailsMultiEl.innerHTML = shown.map(t => `<div class="multi-details-item">
        ${tid(t)}
        <span class="multi-details-dates">
          <span class="d-k">Início</span>${t.pedidoDate ? fmt(t.pedidoDate) : '—'}
          &nbsp;·&nbsp;
          <span class="d-k">Previsto</span>${t.prevDate ? fmt(t.prevDate) : '—'}
        </span>
      </div>`).join('');
  }
}

function renderLote(value) {
  if (!loteEl) return;
  loteEl.textContent = 'TICKET';
}

// Helper: escape básico para conteúdo dinâmico inserido via innerHTML
function escapeHtml(str) {
  return String(str == null ? '' : str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// Promises in-flight de fetch a separadores secundários, para de-dupe no mesmo tick.
const SECONDARY_TAB_INFLIGHT = {};

function fetchSecondaryTable(tab) {
  if (!SECONDARY_TAB_INFLIGHT[tab]) {
    SECONDARY_TAB_INFLIGHT[tab] = fetchSheetTable({ id: SHEET_CONFIG_DEFAULT.id, tab })
      .finally(() => { delete SECONDARY_TAB_INFLIGHT[tab]; });
  }
  return SECONDARY_TAB_INFLIGHT[tab];
}

// Vai buscar a linha 2 (primeira linha de dados) de um separador e devolve os
// campos pedidos como { [chave]: valor }. Cada campo é { header, column }.
// Faz de-dupe se já existe um fetch em curso para o mesmo separador.
async function fetchSecondaryRowFields(tab, fields) {
  const table = await fetchSecondaryTable(tab);
  const out = {};
  if (!table || !Array.isArray(table.rows) || !table.rows[0]) {
    return out;
  }
  const firstRow = table.rows[0];
  Object.keys(fields).forEach(key => {
    const { header, column } = fields[key];
    const idx = findSheetCell(table, header, column);
    out[key] = idx >= 0 ? getValueFromRow(firstRow, idx) : null;
  });
  return out;
}

// Lê valores de várias colunas em várias linhas de um separador.
// `columns` é um objecto { chave: { header, column } } a definir as colunas pretendidas.
// `startRow`/`endRow` são números de linha 1-indexed da Sheet (linha 1 = cabeçalho).
// Devolve um array de objectos, um por linha de dados, com as chaves pedidas.
//
// Nota técnica: o gviz com headers=1 desloca os índices — a linha 2 da Sheet
// corresponde a rows[0], a linha 3 a rows[1], etc. Esta função abstrai isso.
async function fetchSecondaryRowsRange(tab, columns, startRow, endRow) {
  const table = await fetchSecondaryTable(tab);
  if (!table || !Array.isArray(table.rows)) return [];

  // Resolver o índice de cada coluna uma vez
  const resolved = {};
  Object.keys(columns).forEach(key => {
    const { header, column } = columns[key];
    resolved[key] = findSheetCell(table, header, column);
  });

  // Linha N (1-indexed) da Sheet → rows[N-2] no gviz (porque rows[0] = linha 2)
  const startIdx = Math.max(0, startRow - 2);
  const endIdx = Math.min(table.rows.length - 1, endRow - 2);

  const out = [];
  for (let i = startIdx; i <= endIdx; i += 1) {
    const row = table.rows[i];
    if (!row) continue;
    const obj = {};
    Object.keys(resolved).forEach(key => {
      const idx = resolved[key];
      obj[key] = idx >= 0 ? getValueFromRow(row, idx) : null;
    });
    out.push(obj);
  }
  return out;
}

// Vai buscar valores de uma coluna do separador `tab` para alimentar um card-lista.
//
// Modo "column" (default): lê primeiras N linhas da coluna `column` (ou pelo `header`).
// Modo "row-headers": lê os labels do cabeçalho (linha 1) das colunas entre
// `startColumn` e `endColumn`, e devolve só aqueles cuja célula da linha 2
// não está vazia. Útil para mostrar "que postos estão activos agora".
// STATUS considerado "concluído" → item esbatido e enviado para o fim da lista
const OBJ_DONE_RE = /conclu|feito|fechad|termin|done|ok\b/i;

// Cor da etiqueta de STATUS no card Planeamento
function objStatusClass(status) {
  const s = String(status || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  if (/analise/.test(s)) return ' st-analise';   // cinza
  if (/agendad/.test(s)) return ' st-agendado';  // azul
  if (/em curso|curso/.test(s)) return ' st-curso'; // amarelo
  if (/finaliz|conclu/.test(s)) return ' st-final'; // verde
  return '';
}

// Datas da folha de Objetivos: aceita "dd/mm/aaaa" (texto) ou Date(...) do gviz
function parseObjDate(value) {
  if (value == null || String(value).trim() === '') return null;
  const m = String(value).trim().match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/);
  if (m) {
    const y = m[3].length === 2 ? 2000 + Number(m[3]) : Number(m[3]);
    const d = new Date(y, Number(m[2]) - 1, Number(m[1]));
    return isNaN(d.getTime()) ? null : d;
  }
  return parseSheetDate(value);
}

// IDs da folha de Objetivos com 4 algarismos (o gviz devolve "0001" como número 1)
function fmtTicketId(id) {
  const s = String(id == null ? '' : id).trim();
  return /^\d+(\.0+)?$/.test(s) ? String(parseInt(s, 10)).padStart(4, '0') : s;
}

// Coluna EVOLUÇÃO (I): "10" = 10%. Se a célula estiver formatada como % no
// Sheets (ex: "10%"), o gviz devolve 0.1 → converte para 10. Vazio → null.
function parseObjEvolucao(row, idx) {
  if (!row || !Array.isArray(row.c) || idx < 0) return null;
  const cell = row.c[idx];
  if (!cell || (cell.v == null && cell.f == null)) return null;
  const fmt = cell.f != null ? String(cell.f) : '';
  let n;
  if (typeof cell.v === 'number') {
    n = fmt.includes('%') ? cell.v * 100 : cell.v;
  } else {
    const m = String(cell.v != null ? cell.v : fmt).replace(',', '.').match(/-?\d+(\.\d+)?/);
    if (!m) return null;
    n = Number(m[0]);
  }
  return Number.isFinite(n) ? Math.max(0, Math.min(100, Math.round(n))) : null;
}

async function fetchZonaListValues(source) {
  const cfg = {
    id: source.sheetId || SHEET_CONFIG_DEFAULT.id,
    tab: source.tab,
    gid: source.gid,
  };
  const table = await fetchSheetTable(cfg);

  if (source.mode === 'objetivos') {
    if (!table || !Array.isArray(table.rows)) return [];
    const col = (header, letter) => findSheetCell(table, header, letter);
    const idx = {
      id: col('ID', 'A'),
      objetivo: col('OBJETIVO', 'B'),
      pedido: col('DATA PEDIDO', 'C'),
      prevista: col('DATA PREVISTA', 'D'),
      quem: col('PEDIDO POR:', 'E'),
      pais: col('PAÍS', 'F'),
      status: col('STATUS', 'G'),
      modelo: col('MODELO', 'H'),
      evolucao: col('EVOLUÇÃO', 'I'),
    };
    const txt = (row, i) => {
      const v = getValueFromRow(row, i);
      return v == null ? '' : String(v).trim();
    };
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const items = table.rows.map(row => {
      const value = txt(row, idx.objetivo);
      if (!value) return null;
      const status = txt(row, idx.status);
      const done = OBJ_DONE_RE.test(status);
      const prevRaw = getValueFromRow(row, idx.prevista);
      const prevDate = parseObjDate(prevRaw);
      const prevTxt = prevDate
        ? prevDate.toLocaleDateString('pt-PT', { day: '2-digit', month: '2-digit' })
        : (prevRaw != null ? String(prevRaw).trim() : '');
      const late = !done && prevDate && prevDate < today;
      const modelo = txt(row, idx.modelo);
      const meta = [modelo, txt(row, idx.quem), txt(row, idx.pais), prevTxt].filter(Boolean).join(' · ');
      return { id: fmtTicketId(txt(row, idx.id)), modelo, pais: txt(row, idx.pais), pedidoDate: parseObjDate(getValueFromRow(row, idx.pedido)), prevDate, evolucao: parseObjEvolucao(row, idx.evolucao), value, meta, status, dim: done, late };
    }).filter(Boolean);
    // Pendentes primeiro (ordem da folha), concluídos no fim
    items.sort((a, b) => Number(a.dim) - Number(b.dim));
    // Cartão principal: todos os tickets EM CURSO (ordem da folha);
    // se não houver nenhum, mostra o primeiro da lista.
    const emCurso = items.filter(it => objStatusClass(it.status) === ' st-curso');
    renderTickets(emCurso.length ? emCurso : items.slice(0, 1));
    return items.slice(0, Math.max(1, source.limit || 6));
  }

  if (source.mode === 'row-headers') {
    if (!table || !Array.isArray(table.cols) || !Array.isArray(table.rows) || !table.rows[0]) {
      return [];
    }
    const startIdx = columnLetterToIndex(source.startColumn);
    const endIdx = columnLetterToIndex(source.endColumn);
    if (startIdx < 0 || endIdx < 0 || endIdx < startIdx) {
      return [];
    }
    const ignore = new Set((source.ignoreLabels || []).map(s => String(s).trim()));
    const firstRow = table.rows[0]; // linha 2 da Sheet (gviz com headers=1 desloca)
    const limit = Math.max(1, source.limit || 50);
    const labelAt = (idx) => {
      const col = table.cols[idx] || {};
      return col.label != null && String(col.label).trim() !== ''
        ? String(col.label).trim()
        : String(col.id || '').trim();
    };

    // percentLabel: colunas em pares [Posto | %]. Mostra o cabeçalho do posto
    // quando a célula da linha 2 na coluna "%" ao lado vale 100%.
    if (source.percentLabel) {
      const pctLabel = String(source.percentLabel).trim();
      const isFull = (value) => {
        if (value == null) return false;
        if (typeof value === 'number') return value === 1 || value === 100;
        const s = String(value).trim().replace(',', '.');
        if (s === '') return false;
        const num = s.endsWith('%') ? Number(s.slice(0, -1)) / 100 : Number(s);
        return num === 1 || num === 100;
      };
      const values = [];
      for (let i = startIdx + 1; i <= endIdx && i < table.cols.length && values.length < limit; i += 1) {
        if (labelAt(i) !== pctLabel) continue;
        if (!isFull(getValueFromRow(firstRow, i))) continue;
        const label = labelAt(i - 1);
        if (label === '' || label === pctLabel) continue;
        values.push(label);
      }
      return values;
    }
    // matchValue: se definido, só mostra colunas cuja célula da linha 2
    // tenha esse valor exacto.
    const matchValue = source.matchValue;
    const hasMatchFilter = matchValue !== undefined && matchValue !== null;
    const values = [];
    for (let i = startIdx; i <= endIdx && i < table.cols.length && values.length < limit; i += 1) {
      const value = getValueFromRow(firstRow, i);
      if (value == null || String(value).trim() === '') continue;

      if (hasMatchFilter) {
        const num = typeof value === 'number'
          ? value
          : Number(String(value).trim().replace(',', '.'));
        if (!Number.isFinite(num) || num !== Number(matchValue)) continue;
      }

      const col = table.cols[i] || {};
      const rawLabel = col.label != null && String(col.label).trim() !== ''
        ? String(col.label).trim()
        : String(col.id || '').trim();
      if (rawLabel === '' || ignore.has(rawLabel)) continue;

      values.push(source.replaceDots ? rawLabel.replace(/\./g, '_') : rawLabel);
    }
    return values;
  }

  // Modo default: percorre as primeiras linhas de uma única coluna
  // Modo default: percorre as primeiras linhas de uma única coluna.
  // Se `dimColumn`/`dimHeader` for fornecido, cada item vem como { value, dim }
  // onde dim=true se a célula da coluna de "dim" nessa mesma linha não estiver vazia.
  const colIndex = findSheetCell(table, source.header, source.column);
  if (colIndex < 0 || !Array.isArray(table.rows)) {
    return [];
  }
  const dimColIndex = (source.dimColumn || source.dimHeader)
    ? findSheetCell(table, source.dimHeader, source.dimColumn)
    : -1;
  const limit = Math.max(1, source.limit || 5);
  const values = [];
  for (let i = 0; i < table.rows.length && values.length < limit; i += 1) {
    const v = getValueFromRow(table.rows[i], colIndex);
    if (v != null && String(v).trim() !== '') {
      const item = { value: String(v).trim(), dim: false };
      if (dimColIndex >= 0) {
        const dimVal = getValueFromRow(table.rows[i], dimColIndex);
        item.dim = dimVal != null && String(dimVal).trim() !== '';
      }
      values.push(item);
    }
  }
  return values;
}

function buildZonaPctCard(config, rowData) {
  // Suporta dois modos:
  //   1) rowData é a linha completa do PM1 → vai buscar via getFieldValue
  //   2) rowData = { __raw: valor } → usa o valor directamente (cards lidos de separadores externos)
  let raw;
  if (rowData && Object.prototype.hasOwnProperty.call(rowData, '__raw')) {
    raw = rowData.__raw;
  } else {
    raw = getFieldValue(rowData, config.header, config.column, 0);
  }
  const pct = parseSheetPercentage(raw) || 0;
  const cls = pct === 100 ? 'done' : pct > 0 ? 'going' : 'empty';
  const col = bc(pct);
  const card = document.createElement('div');
  card.className = `zona-card ${cls}${config.tall ? ' tall' : ''}`;
  card.innerHTML = `
    <div class="zona-card-label">${escapeHtml(config.nome)}</div>
    <div class="zona-card-pct" style="color:${col || 'rgba(255,255,255,0.15)'}">${pct}%</div>
    <div class="zona-card-bar">
      <div class="zona-card-fill" style="width:${pct}%;background:${col || 'rgba(255,255,255,0.07)'}"></div>
    </div>`;
  return card;
}

function buildZonaListCard(config, items) {
  const list = Array.isArray(items) ? items : [];
  const cls = list.length > 0 ? 'going' : 'empty';
  const card = document.createElement('div');
  card.className = `zona-card list ${cls}${config.tall ? ' tall' : ''}`;

  // Cada item pode ser uma string (modo simples) ou um objecto { value, dim }
  // (quando há coluna auxiliar a controlar o "esbatido").
  const itemsHtml = list.length
    ? list.map(item => {
        const text = (item && typeof item === 'object') ? item.value : item;
        const dim = !!(item && typeof item === 'object' && item.dim);
        // Item rico (ex: Objetivos): título + meta + etiqueta de status
        if (item && typeof item === 'object' && ('meta' in item || 'status' in item)) {
          const statusCls = objStatusClass(item.status) || (item.dim ? ' is-done' : (item.late ? ' is-late' : ''));
          return `<div class="zona-card-list-item obj-item${dim ? ' dim' : ''}">
              <div class="obj-top">
                ${item.id ? `<span class="obj-id">#${escapeHtml(item.id)}</span>` : ''}
                <span class="obj-title">${escapeHtml(text)}</span>
                ${item.status ? `<span class="obj-status${statusCls}">${escapeHtml(item.status)}</span>` : ''}
              </div>
              ${item.meta ? `<div class="obj-meta${item.late ? ' is-late' : ''}">${escapeHtml(item.meta)}</div>` : ''}
            </div>`;
        }
        return `<div class="zona-card-list-item${dim ? ' dim' : ''}">${escapeHtml(text)}</div>`;
      }).join('')
    : '<div class="zona-card-list-empty">Sem dados</div>';

  const src = config.listSource || {};
  const headerLabel = src.headerLabel || src.header || 'LOTE';
  const headerHtml = src.hideHeader
    ? ''
    : `<div class="zona-card-list-header">${escapeHtml(headerLabel)}</div>`;

  // Layout em grid (ex: Histórico em 3×4 fluxo coluna-a-coluna)
  let itemsClass = 'zona-card-list-items';
  let itemsStyle = '';
  if (src.gridLayout) {
    const { cols = 3, rows = 4, flow = 'row' } = src.gridLayout;
    itemsClass += ' is-grid-list';
    itemsStyle = ` style="--grid-cols:${cols};--grid-rows:${rows};grid-auto-flow:${flow === 'column' ? 'column' : 'row'};"`;
  }

  card.innerHTML = `
    <div class="zona-card-label">${escapeHtml(config.nome)}</div>
    ${headerHtml}
    <div class="${itemsClass}"${itemsStyle}>${itemsHtml}</div>`;
  return card;
}

function buildZonaSingleCard(config, value) {
  const txt = value != null && String(value).trim() !== '' ? String(value).trim() : null;
  const cls = txt ? 'going' : 'empty';
  const card = document.createElement('div');
  card.className = `zona-card single ${cls}${config.tall ? ' tall' : ''}`;
  card.innerHTML = `
    <div class="zona-card-label">${escapeHtml(config.nome)}</div>
    <div class="zona-card-single-value">${escapeHtml(txt || '—')}</div>`;
  return card;
}

/* ── GOOGLE CALENDAR (via Apps Script — ver apps-script/calendar-proxy.gs) ──
   Colar aqui o URL da Aplicação Web (termina em /exec). Enquanto estiver
   vazio, os cards de calendário mostram "Calendário não configurado". */
const CALENDAR_PROXY_URL = 'https://script.google.com/macros/s/AKfycbwLe6UuCRf5BHerq0tva4HAWMX5naXcTHYw-lpmpDC2Ux8bNHCLygyBB0BA2BjIJc-tmw/exec';
const CAL_TZ = 'Europe/Lisbon';

async function fetchCalendarEvents(src) {
  if (!CALENDAR_PROXY_URL) throw new Error('CALENDAR_PROXY_URL não configurado');
  const url = `${CALENDAR_PROXY_URL}?cal=${encodeURIComponent(src.cal)}&days=${src.days || 30}&_=${Date.now()}`;
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || 'Erro no Apps Script');
  // Remove prefixos redundantes com o nome do card ("Tec Support - ", "Suporte Técnico - ")
  const stripTitle = t => String(t || '').replace(/^\s*(tec(h)?\s*support|suporte(\s*t[ée]cnico|\s*24h)?)\s*[-–:·]\s*/i, '').trim() || String(t || '');
  return (data.events || []).map(ev => ({
    title: stripTitle(ev.title),
    start: new Date(ev.start),
    end: new Date(ev.end),
    allDay: !!ev.allDay,
  }));
}

const calDayFmt = new Intl.DateTimeFormat('pt-PT', { timeZone: CAL_TZ, day: '2-digit', month: '2-digit' });
const calWeekdayFmt = new Intl.DateTimeFormat('en-US', { timeZone: CAL_TZ, weekday: 'short' });
const calTimeFmt = new Intl.DateTimeFormat('pt-PT', { timeZone: CAL_TZ, hour: '2-digit', minute: '2-digit' });
const CAL_WEEKDAYS = { Sun: 'Dom', Mon: 'Seg', Tue: 'Ter', Wed: 'Qua', Thu: 'Qui', Fri: 'Sex', Sat: 'Sáb' };

function formatCalWhen(ev) {
  const day = `${CAL_WEEKDAYS[calWeekdayFmt.format(ev.start)] || ''} ${calDayFmt.format(ev.start)}`.trim();
  return ev.allDay ? day : `${day} ${calTimeFmt.format(ev.start)}`;
}

function isCalOngoing(ev, now = new Date()) {
  return ev.start <= now && ev.end > now;
}

// events: null = a carregar, Error = falha, array = dados
function buildZonaCalendarCard(config, events) {
  const src = config.calendarSource || {};
  const card = document.createElement('div');
  const tall = config.tall ? ' tall' : '';
  const label = `<div class="zona-card-label">${escapeHtml(config.nome)}</div>`;
  const now = new Date();

  let msg = null;
  if (!CALENDAR_PROXY_URL) msg = 'Calendário não configurado';
  else if (events instanceof Error) msg = 'Sem ligação ao calendário';
  else if (events == null) msg = 'A carregar…';

  if (src.mode === 'current') {
    let value = msg, sub = '';
    if (!msg) {
      // Na passagem de turno há 2 eventos em curso — mostra o que começou mais recentemente
      const current = events.filter(ev => isCalOngoing(ev, now)).pop();
      const next = current ? null : events[0];
      if (current) {
        value = current.title;
        // Dia inteiro: o fim é exclusivo (00:00 do dia seguinte) → último dia = fim - 1ms
        sub = current.allDay
          ? `Até ${formatCalWhen({ start: new Date(current.end.getTime() - 1), allDay: true })}`
          : `Até ${calTimeFmt.format(current.end)}`;
      } else if (next) {
        value = next.title;
        sub = `Próximo · ${formatCalWhen(next)}`;
      } else {
        value = 'Sem eventos';
      }
    }
    const hasValue = !msg && value !== 'Sem eventos';
    card.className = `zona-card single ${hasValue ? 'going' : 'empty'}${tall}`;
    card.innerHTML = `${label}
      <div class="zona-card-single-value">${escapeHtml(value)}</div>
      ${sub ? `<div class="zona-card-single-sub">${escapeHtml(sub)}</div>` : ''}`;
    return card;
  }

  // mode: 'list'
  const list = msg ? [] : events.slice(0, src.limit || 6);
  card.className = `zona-card list ${list.length ? 'going' : 'empty'}${tall}`;
  const itemsHtml = list.length
    ? list.map(ev => `
        <div class="zona-card-list-item cal-item${isCalOngoing(ev, now) ? ' active' : ''}">
          <span class="cal-when">${escapeHtml(formatCalWhen(ev))}</span>
          <span class="cal-title">${escapeHtml(ev.title)}</span>
        </div>`).join('')
    : `<div class="zona-card-list-empty">${escapeHtml(msg || 'Sem eventos')}</div>`;
  card.innerHTML = `${label}<div class="zona-card-list-items">${itemsHtml}</div>`;
  return card;
}

function renderZones(rowData) {
  zg.innerHTML = '';
  ZONA_CONFIGS.forEach(config => {
    if (config.type === 'list') {
      const src = config.listSource || {};
      const cacheKey = src.mode === 'row-headers'
        ? `list|${src.tab}|rowheaders|${src.startColumn}-${src.endColumn}`
        : src.mode === 'objetivos'
          ? `list|${src.sheetId}|gid${src.gid}|objetivos`
          : `list|${src.tab}|${src.column || src.header}`;
      const cached = ZONA_LIST_CACHE[cacheKey];
      const card = buildZonaListCard(config, cached);
      zg.appendChild(card);

      fetchZonaListValues(src)
        .then(values => {
          ZONA_LIST_CACHE[cacheKey] = values;
          const fresh = buildZonaListCard(config, values);
          card.replaceWith(fresh);
          applyActiveHighlight();
        })
        .catch(err => console.warn(`Falha a carregar lista para "${config.nome}":`, err));
    } else if (config.type === 'calendar') {
      const src = config.calendarSource || {};
      const cacheKey = `cal|${src.cal}`;
      const card = buildZonaCalendarCard(config, ZONA_LIST_CACHE[cacheKey] || null);
      zg.appendChild(card);
      if (!CALENDAR_PROXY_URL) return;

      fetchCalendarEvents(src)
        .then(events => {
          ZONA_LIST_CACHE[cacheKey] = events;
          card.replaceWith(buildZonaCalendarCard(config, events));
        })
        .catch(err => {
          console.warn(`Falha a carregar calendário para "${config.nome}":`, err);
          // Mantém os últimos dados bons, se existirem
          if (!ZONA_LIST_CACHE[cacheKey]) card.replaceWith(buildZonaCalendarCard(config, err));
        });
    } else if (config.type === 'single') {
      const src = config.singleSource || {};
      const cacheKey = `single|${src.tab}|${src.column || src.header}`;
      const cached = ZONA_LIST_CACHE[cacheKey];
      const card = buildZonaSingleCard(config, cached);
      zg.appendChild(card);

      fetchSecondaryRowFields(src.tab, {
        v: { header: src.header, column: src.column },
      }).then(({ v }) => {
        ZONA_LIST_CACHE[cacheKey] = v;
        const fresh = buildZonaSingleCard(config, v);
        card.replaceWith(fresh);
      }).catch(err => console.warn(`Falha a carregar valor para "${config.nome}":`, err));
    } else if (config.tab) {
      // Card percentual lido de um separador específico (ex: PS1)
      const cacheKey = `pct|${config.tab}|${config.column || config.header}`;
      const cached = ZONA_LIST_CACHE[cacheKey];
      // Render imediato com o que está em cache (evita pisca)
      const card = buildZonaPctCard(config, cached != null ? { __raw: cached } : null);
      zg.appendChild(card);

      fetchSecondaryRowFields(config.tab, {
        v: { header: config.header, column: config.column },
      }).then(({ v }) => {
        ZONA_LIST_CACHE[cacheKey] = v;
        // Constrói card fresco com o valor recebido
        const fresh = buildZonaPctCard(config, { __raw: v });
        card.replaceWith(fresh);
      }).catch(err => console.warn(`Falha a carregar pct para "${config.nome}":`, err));
    } else {
      zg.appendChild(buildZonaPctCard(config, rowData));
    }
  });
  // Aplica o destaque a quaisquer cartas-lista renderizadas a partir da cache
  applyActiveHighlight();
}

function renderDeadlineHours() {
  const hoursInfo = deadlineHoursInput
    ? getDeadlineHours(deadlineHoursInput.start, deadlineHoursInput.due, deadlineHoursInput.time)
    : null;
  const hasHours = Boolean(hoursInfo && hoursInfo.total > 0);

  if (prazoHoursEl) {
    prazoHoursEl.hidden = !hasHours;
  }
  if (!prazoHoursBarEl) {
    return;
  }
  if (!hasHours) {
    prazoHoursBarEl.style.width = '0%';
    prazoHoursBarEl.setAttribute('aria-valuenow', '0');
    prazoHoursBarEl.setAttribute('aria-valuemax', '0');
    prazoHoursBarEl.setAttribute('aria-valuetext', 'Sem horas úteis disponíveis');
    return;
  }

  const ratio = Math.min(1, hoursInfo.elapsed / hoursInfo.total);
  const color = ratio >= .9 ? '#ff3b3b' : ratio >= .7 ? '#ffaa00' : '#00ff87';
  prazoHoursBarEl.style.width = `${ratio * 100}%`;
  prazoHoursBarEl.style.background = color;
  prazoHoursBarEl.setAttribute('aria-valuemin', '0');
  prazoHoursBarEl.setAttribute('aria-valuemax', String(hoursInfo.total));
  prazoHoursBarEl.setAttribute('aria-valuenow', String(hoursInfo.elapsed));
  prazoHoursBarEl.setAttribute('aria-valuetext', `${formatWorkHours(hoursInfo.elapsed)} de ${formatWorkHours(hoursInfo.total)} horas úteis`);
}

setInterval(renderDeadlineHours, 60 * 1000);

function updateDeadline(startValue, dueValue, startTimeValue) {
  // Helper: limpa o bloco de prazo para o estado "sem dados"
  const clearDeadline = () => {
    const dash = '-';
    if (prazoUsedEl) {
      prazoUsedEl.textContent = dash;
      prazoUsedEl.style.color = 'rgba(255,255,255,0.4)';
      prazoUsedEl.style.textShadow = 'none';
    }
    if (prazoTotalEl) {
      prazoTotalEl.textContent = dash;
    }
    const unitEl = document.querySelector('.prazo-unit');
    if (unitEl) {
      unitEl.textContent = 'DIAS';
    }
    if (prazoBarEl) {
      prazoBarEl.style.width = '0%';
      prazoBarEl.style.background = 'rgba(255,255,255,0.15)';
    }
    if (prazoHoursEl) {
      prazoHoursEl.hidden = true;
    }
    deadlineHoursInput = null;
    renderDeadlineHours();
    if (folgaEl) {
      folgaEl.textContent = '—';
      folgaEl.style.color = 'rgba(255,255,255,0.4)';
    }
  };

  if (startValue == null || String(startValue).trim() === '' ||
      dueValue == null || String(dueValue).trim() === '') {
    clearDeadline();
    return;
  }

  const today = new Date();
  today.setHours(0, 0, 0, 0);

  const total = getWorkDaysCount(startValue, dueValue, true);
  const used = getWorkDaysCount(startValue, today, true);
  const remaining = getWorkDaysCount(today, dueValue, false);

  if (total == null || used == null || remaining == null) {
    clearDeadline();
    return;
  }

  const ratio = total > 0 ? Math.min(1, used / total) : 0;
  const isOverdue = used > total;
  const pc = isOverdue ? '#ff3b3b' : ratio >= .7 ? '#ffaa00' : '#00ff87';

  if (prazoUsedEl) {
    prazoUsedEl.textContent = used;
    prazoUsedEl.style.color = pc;
    prazoUsedEl.style.textShadow = `0 0 40px ${pc}50`;
  }
  if (prazoBarEl) {
    prazoBarEl.style.width = `${ratio * 100}%`;
    prazoBarEl.style.background = pc;
  }
  deadlineHoursInput = { start: startValue, due: dueValue, time: startTimeValue };
  renderDeadlineHours();
  if (folgaEl) {
    folgaEl.textContent = `${remaining} dias restantes`;
    folgaEl.style.color = isOverdue ? '#ff3b3b' : remaining <= 3 ? '#ffaa00' : '#00ff87';
  }
  if (prazoTotalEl) {
    prazoTotalEl.textContent = total;
  }
  const unitEl = document.querySelector('.prazo-unit');
  if (unitEl) {
    unitEl.textContent = 'dias';
  }
}

// Modelo/Lote (PS1!D2), Início (PS1!J2), Previsto (PS1!F2) e estado (PS1!A2).
function refreshPs1Details() {
  const DATE_PLACEHOLDER = '-- / -- / ----';
  const MODEL_PLACEHOLDER = '—';

  // Separa "MWS500 SDS - 87L" → { modelo: "MWS500 SDS", lote: "87L" }.
  // Se não terminar em "<2 dígitos>L", devolve { modelo: <string toda>, lote: null }.
  function parseModeloLote(raw) {
    const text = raw == null ? '' : String(raw).trim();
    if (text === '' || /^[-–—]+$/.test(text)) return { modelo: '', lote: null };
    // Padrão: começa pela parte do modelo, segue " - " (espaços flexíveis), 2 dígitos + L no fim
    const m = text.match(/^(.*?)\s*-\s*(\d{2}L)$/);
    if (m) {
      return { modelo: m[1].trim(), lote: m[2] };
    }
    return { modelo: text, lote: null };
  }

  return fetchSecondaryRowFields('PS1', {
    inicio: { header: 'INÍCIO SOLDADURA / ACABAMENTO', column: 'J' },
    inicioHora: { column: 'DW' },
    previsto: { header: 'DATA PRETENDIDA', column: 'F' },
    modeloLote: { header: 'LOTE', column: 'D' },
    chaveProcura: { header: 'Chave de Procura', column: 'A' },
  }).then(({ inicio, inicioHora, previsto, modeloLote, chaveProcura }) => {
    const inicioFmt = inicio != null && String(inicio).trim() !== ''
      ? formatSheetDate(inicio) || DATE_PLACEHOLDER
      : DATE_PLACEHOLDER;
    const previstoFmt = previsto != null && String(previsto).trim() !== ''
      ? formatSheetDate(previsto) || DATE_PLACEHOLDER
      : DATE_PLACEHOLDER;
    // Início / Previsto / Prazo vêm agora da folha de Objetivos (ver updatePrazoFromTickets)

    const { modelo, lote } = parseModeloLote(modeloLote);
    modelDataAvailable = Boolean(modelo);
    // Modelo / Equipamento vem agora da coluna MODELO (H) da folha de Objetivos (ver renderTickets)
    loadAndRenderPaises();
    if (loteEl) {
      loteEl.textContent = 'TICKET';
    }
    // Actualiza referência usada pelas listas para destacar o item activo
    currentModeloLote = (modelo && lote) ? `${modelo} - ${lote}` : null;
    applyActiveHighlight();

    updateStatus(chaveProcura);
  }).catch(err => {
    console.warn('Falha a carregar dados do PS1:', err);
    modelDataAvailable = false;
    loadAndRenderPaises();
    if (loteEl) {
      loteEl.textContent = 'TICKET';
    }
    updateStatus(null);
    currentModeloLote = null;
    applyActiveHighlight();
  });
}
