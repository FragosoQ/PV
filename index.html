function getPs1ActivePriorityPercentage(table, row, activePriority) {
  const priorityNumber = Number(String(activePriority == null ? '' : activePriority).trim());
  if (!Number.isInteger(priorityNumber) || priorityNumber < 1) return null;

  const startIndex = columnLetterToIndex('AL');
  const endIndex = columnLetterToIndex('CE');
  const targetHeader = normalizeString(`P${priorityNumber}`);
  for (let index = startIndex; index <= endIndex && index + 1 < table.cols.length; index += 1) {
    const header = normalizeString(table.cols[index].label || table.cols[index].id || '');
    if (header !== targetHeader) continue;

    const percentageHeader = normalizeString(table.cols[index + 1].label || table.cols[index + 1].id || '');
    if (percentageHeader !== '%') return null;

    const rawPercentage = getValueFromRow(row, index + 1);
    if (rawPercentage == null || String(rawPercentage).trim() === '') return null;
    const percentage = parseSheetPercentage(rawPercentage);
    return percentage != null && percentage !== 100 ? percentage : null;
  }
  return null;
}

// Prioridades com progresso calculado pelo tempo decorrido (horas de turno).
// Os inícios vêm de DX:EW; os tempos previstos, de EX:FW; done = % da prioridade (100% fecha).
const TIMED_PRIORITIES = {
  '0.1': { done: 'AM' },
  '0.2': { done: 'AO' },
  '11.1': { done: 'BO' },
  '11.2': { done: 'BQ' },
  '11.3': { done: 'BS' },
};

const TIMED_PRIORITY_SUFFIXES = [
  '0,1', '0,2', '0,3', '1', '2', '3', '4', '5', '6', '7.1', '7.2', '8', '9',
  '10', '11,1', '11,2', '11,3', '12,1', '12,2', '12,3', '13,1', '13,2', '13,3',
  '14', '15', '16',
];

function getTimedPriorityKey(prioridade) {
  const n = Number(String(prioridade == null ? '' : prioridade).trim().replace(',', '.'));
  if (!Number.isFinite(n)) return null;
  const key = n.toFixed(1);
  return TIMED_PRIORITIES[key] ? key : null;
}

function getTimedPriorityValue(table, priorityKey, prefix) {
  const headerRow = table && table.rows && table.rows[0];
  const valueRow = table && table.rows && table.rows[1];
  if (!headerRow || !valueRow) return null;

  const targetHeader = `${prefix}${priorityKey.replace('.', ',')}`;
  const headerIndex = headerRow.c.findIndex(cell =>
    String(cell && (cell.v != null ? cell.v : cell.f) || '').trim().toUpperCase() === targetHeader
  );
  const index = headerIndex >= 0 ? headerIndex : TIMED_PRIORITY_SUFFIXES.indexOf(priorityKey.replace('.', ','));
  return index >= 0 ? getValueFromRow(valueRow, index) : null;
}

// Hora de início → Date. Formato normal: "2026/10/21 16:04:01". Aceita também "09:30:00", "Date(y,m,d,h,mi,s)",
// [h,mi,s] (timeofday), "14:00" ou fração do dia.
// Se só houver hora, assume o dia de hoje.
function parsePriorityStart(value, now = new Date()) {
  if (value == null || String(value).trim() === '') return null;
  const atToday = (h, mi, sec) => {
    const d = new Date(now);
    d.setHours(h, mi, sec || 0, 0);
    return d;
  };
  if (Array.isArray(value)) return atToday(Number(value[0]) || 0, Number(value[1]) || 0, Number(value[2]) || 0);
  if (typeof value === 'number') {
    if (value >= 0 && value < 1) return atToday(0, Math.round(value * 24 * 60), 0);
    return null;
  }
  const text = String(value).trim();
  const dt = text.match(/^Date\((\d+),(\d+),(\d+)(?:,(\d+),(\d+)(?:,(\d+))?)?\)$/);
  if (dt) {
    const [, y, m, d, h, mi, sec] = dt.map(Number);
    if (y < 1900) return atToday(h || 0, mi || 0, sec || 0); // só hora (base 1899-12-30)
    return new Date(y, m, d, h || 0, mi || 0, sec || 0);
  }
  const iso = text.match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})[\sT]+(\d{1,2}):(\d{2})(?::(\d{2}))?$/);
  if (iso) {
    const [, y, m, d, h, mi, sec] = iso.map(Number);
    return new Date(y, m - 1, d, h, mi, sec || 0);
  }
  const full = text.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})\s+(\d{1,2})[:h](\d{2})(?::(\d{2}))?$/);
  if (full) {
    const [, d, m, y, h, mi, sec] = full.map(Number);
    return new Date(y, m - 1, d, h, mi, sec || 0);
  }
  const time = text.match(/^(\d{1,2})[:h](\d{2})?(?::(\d{2}))?$/i);
  if (time) return atToday(Number(time[1]), Number(time[2] || 0), Number(time[3] || 0));
  return null;
}

// Duração estimada → horas. Aceita "04:00:00", número de horas (4 / "4,5"), "4h30" ou [h,mi,s].
function parsePriorityDurationHours(value) {
  if (value == null || String(value).trim() === '') return null;
  if (Array.isArray(value)) return (Number(value[0]) || 0) + (Number(value[1]) || 0) / 60 + (Number(value[2]) || 0) / 3600;
  if (typeof value === 'number') return value > 0 ? value : null;
  const text = String(value).trim();
  const dt = text.match(/^Date\(\d+,\d+,\d+,(\d+),(\d+)(?:,(\d+))?\)$/);
  if (dt) return Number(dt[1]) + Number(dt[2]) / 60 + Number(dt[3] || 0) / 3600;
  const hm = text.match(/^(\d+)\s*[:h]\s*(\d{1,2})?(?::(\d{2}))?$/i);
  if (hm) return Number(hm[1]) + Number(hm[2] || 0) / 60 + Number(hm[3] || 0) / 3600;
  const n = Number(text.replace(',', '.'));
  return Number.isFinite(n) && n > 0 ? n : null;
}

// Turnos de trabalho (minutos desde a meia-noite): 08:00–13:00 e 14:00–17:15.
const PRIORITY_SHIFTS = [[8 * 60, 13 * 60], [14 * 60, 17 * 60 + 15]];

// Horas de turno decorridas entre `start` e `now`, só em dias úteis.
function getPriorityShiftHours(start, now) {
  if (!(start < now)) return 0;
  const minutesOf = d => d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60;
  const firstDay = new Date(start); firstDay.setHours(0, 0, 0, 0);
  const lastDay = new Date(now); lastDay.setHours(0, 0, 0, 0);
  let minutes = 0;
  for (const day = new Date(firstDay); day <= lastDay; day.setDate(day.getDate() + 1)) {
    if (getWorkDaysCount(day, day, true, day.getFullYear()) !== 1) continue;
    const from = day.getTime() === firstDay.getTime() ? minutesOf(start) : 0;
    const to = day.getTime() === lastDay.getTime() ? minutesOf(now) : 24 * 60;
    PRIORITY_SHIFTS.forEach(([a, b]) => {
      minutes += Math.max(0, Math.min(to, b) - Math.max(from, a));
    });
  }
  return minutes / 60;
}

// Duração dividida em 6 partes: cada parte de horas de turno decorrida soma 1/6, até 5/6.
// A última parte só entra quando a % da prioridade na Sheet (AM2/AO2) = 100%.
function computeTimedPriorityPct(info, now = new Date()) {
  if (!info) return null;
  if (info.donePct === 100) return 100;
  const start = parsePriorityStart(info.start, now);
  const hours = parsePriorityDurationHours(info.duration);
  if (!start || !hours) return 0;
  const parts = Math.floor(getPriorityShiftHours(start, now) / (hours / 6));
  return Math.round(Math.min(5, parts) * (100 / 6) * 10) / 10;
}

async function fetchPs1Summary() {
  const table = await fetchSecondaryTable('PS1');
  const row = table && Array.isArray(table.rows) ? table.rows[0] : null;
  const readValue = (header, column) => {
    const index = findSheetCell(table, header, column);
    return index >= 0 ? getValueFromRow(row, index) : null;
  };
  const prioridadeAtiva = readValue('Posto1', 'CO');
  const timedKey = getTimedPriorityKey(prioridadeAtiva);
  let timedInfo = null;
  if (timedKey) {
    const cols = TIMED_PRIORITIES[timedKey];
    const [startTable, durationTable] = await Promise.all([
      fetchSheetTable({ id: SHEET_CONFIG_DEFAULT.id, tab: 'PS1', range: 'DX1:EW2' }),
      fetchSheetTable({ id: SHEET_CONFIG_DEFAULT.id, tab: 'PS1', range: 'EX1:FW2' }),
    ]);
    timedInfo = {
      start: getTimedPriorityValue(startTable, timedKey, 'T'),
      duration: getTimedPriorityValue(durationTable, timedKey, 'TP'),
      donePct: parseSheetPercentage(readValue(null, cols.done)),
    };
  }
  return {
    prioridadeAtiva,
    prioridadeAtivaPct: timedInfo
      ? computeTimedPriorityPct(timedInfo)
      : getPs1ActivePriorityPercentage(table, row, prioridadeAtiva),
    timedInfo,
    geral: readValue('GERAL(T)', 'N'),
  };
}

/* ── BREAK VIDEO: playlist com crossfade entre vídeos ─────────────────
   Estratégia:
   - 2 elementos <video> empilhados (A e B) que alternam
   - showPlaylist() carrega vídeo 0 em A, fade-in do stage
   - Quando A está perto do fim (1.5s antes), pré-carrega vídeo 1 em B e arranca-o
     mudo, depois faz crossfade (B fica activo, A inactivo)
   - Após o último vídeo terminar, fade-out do stage
   - Tenta autoplay com som; se o browser bloquear, faz retry mudo
   - Disparo automático: 2x por dia em horário fixo Lisboa (09:55 e 15:55)
   - Clique no logo: dispara a playlist imediatamente (testes/demos)
*/
(function setupBreakVideo() {
  const stage = document.getElementById('breakVideoStage');
  const videoA = document.getElementById('breakVideoA');
  const videoB = document.getElementById('breakVideoB');
  if (!stage || !videoA || !videoB) return;

  const PLAYLIST = [
    // Cloudinary auto-optimization: qualidade automática + formato moderno (WebM/AV1
    // onde suportado) + limite de 720p de largura. Reduz substancialmente o peso
    // sem alteração visível em ecrãs até FullHD.
    'https://res.cloudinary.com/djxxk3ipz/video/upload/q_auto,f_auto,w_720/v1778168513/pikaso-untitled-project-2026-05-07_a2clz5.mp4',
  ];
  // Horários fixos Lisboa (HH, MM) em que a playlist deve aparecer
  const SCHEDULE_LISBON = [[9, 55], [13, 55]];
  const FADE_OUT_MS = 0;            // sem fade — desaparece imediato
  const CROSSFADE_MS = 1500;        // bate certo com transition .break-video

  let nextScheduleId = null;
  let crossfadePrepId = null;
  let fadeOutCleanupId = null;
  let isPlaying = false;

  function clearPending() {
    [nextScheduleId, crossfadePrepId, fadeOutCleanupId].forEach(id => {
      if (id != null) clearTimeout(id);
    });
    nextScheduleId = crossfadePrepId = fadeOutCleanupId = null;
  }

  // Tenta dar play com som; se autoplay com som falhar, faz fallback mudo
  function tryPlay(v) {
    v.muted = false;
    const p = v.play();
    if (p && typeof p.then === 'function') {
      p.catch(() => {
        v.muted = true;
        v.play().catch(() => {/* desiste em silêncio */});
      });
    }
  }

  // Ajusta a largura do stage ao ratio do vídeo activo (evita bandas pretas).
  function syncStageWidth(v) {
    if (v.videoWidth > 0 && v.videoHeight > 0) {
      const ratio = v.videoWidth / v.videoHeight;
      const heightPx = stage.offsetHeight;
      if (heightPx > 0) {
        stage.style.width = `${heightPx * ratio}px`;
      }
    }
  }
  videoA.addEventListener('loadedmetadata', () => {
    if (videoA.classList.contains('is-active')) syncStageWidth(videoA);
  });
  videoB.addEventListener('loadedmetadata', () => {
    if (videoB.classList.contains('is-active')) syncStageWidth(videoB);
  });

  function hideAndScheduleNext() {
    isPlaying = false;
    stage.classList.remove('is-visible');
    fadeOutCleanupId = setTimeout(() => {
      [videoA, videoB].forEach(v => {
        try {
          v.pause();
          v.removeAttribute('src');
          v.load();
          v.classList.remove('is-active');
          v.onended = null;
          v.ontimeupdate = null;
          v.onerror = null;
        } catch (e) {}
      });
      fadeOutCleanupId = null;
    }, FADE_OUT_MS);
    scheduleNextLisbon();
  }

  // Limpa todos os listeners/timers associados a um slot
  function detachSlot(slot) {
    slot.onended = null;
    slot.ontimeupdate = null;
    slot.onerror = null;
    slot.onpause = null;
  }

  // Watchdog: ID do timer global que força fade-out se nada acontecer
  let watchdogId = null;
  function clearWatchdog() {
    if (watchdogId != null) { clearTimeout(watchdogId); watchdogId = null; }
  }
  function armWatchdog(slot, onTimeout) {
    clearWatchdog();
    // Se metadata ainda não chegou, usa fallback de 60s
    const duration = Number.isFinite(slot.duration) && slot.duration > 0 ? slot.duration : 60;
    const remainingMs = (duration - (slot.currentTime || 0)) * 1000 + 5000; // +5s margem
    watchdogId = setTimeout(() => {
      watchdogId = null;
      console.warn('[break-video] watchdog: vídeo não terminou no tempo esperado, forçando fade-out');
      onTimeout();
    }, remainingMs);
  }

  // Toca o vídeo no índice i no slot dado (videoA ou videoB).
  function playSlot(slotCurrent, slotOther, i) {
    if (i >= PLAYLIST.length) {
      clearWatchdog();
      hideAndScheduleNext();
      return;
    }

    slotCurrent.classList.add('is-active');
    slotOther.classList.remove('is-active');
    detachSlot(slotCurrent);

    slotCurrent.src = PLAYLIST[i];
    slotCurrent.load();
    tryPlay(slotCurrent);
    syncStageWidth(slotCurrent);

    const nextIdx = i + 1;
    let advanced = false;
    function advance() {
      if (advanced) return;
      advanced = true;
      detachSlot(slotCurrent);
      clearWatchdog();
      playSlot(slotOther, slotCurrent, nextIdx);
    }

    // Quando metadata chegar, arma watchdog com a duração real
    slotCurrent.addEventListener('loadedmetadata', () => {
      armWatchdog(slotCurrent, advance);
    }, { once: true });
    // Watchdog inicial (caso metadata demore) — 60s genérico
    armWatchdog(slotCurrent, advance);

    if (nextIdx < PLAYLIST.length) {
      // Crossfade quando faltarem CROSSFADE_MS para o fim
      let crossfadeStarted = false;
      slotCurrent.ontimeupdate = () => {
        if (crossfadeStarted || advanced) return;
        const remaining = (slotCurrent.duration - slotCurrent.currentTime) * 1000;
        if (Number.isFinite(remaining) && remaining <= CROSSFADE_MS) {
          crossfadeStarted = true;
          slotCurrent.ontimeupdate = null;

          slotOther.src = PLAYLIST[nextIdx];
          slotOther.load();
          const startNext = () => {
            slotOther.removeEventListener('canplay', startNext);
            tryPlay(slotOther);
            slotOther.classList.add('is-active');
            slotCurrent.classList.remove('is-active');
            // Continua fluxo a partir do slotOther
            advanced = true;
            detachSlot(slotCurrent);
            clearWatchdog();
            // Chama playSlot mas sem trocar src (já está carregado), apenas para
            // armar watchdog e listeners no slotOther:
            playSlotContinue(slotOther, slotCurrent, nextIdx);
          };
          slotOther.addEventListener('canplay', startNext, { once: true });
        }
      };
    }

    // Eventos de término / falha — todos chamam advance() (que despacha conforme nextIdx)
    slotCurrent.onended = advance;
    slotCurrent.onerror = (e) => {
      console.warn('[break-video] erro no vídeo, a avançar:', e);
      advance();
    };
  }

  // Continua o fluxo para um slot que já foi carregado (usado depois do crossfade).
  // Diferença para playSlot: não troca o src nem chama load().
  function playSlotContinue(slotCurrent, slotOther, i) {
    if (i >= PLAYLIST.length) {
      clearWatchdog();
      hideAndScheduleNext();
      return;
    }
    detachSlot(slotCurrent);

    const nextIdx = i + 1;
    let advanced = false;
    function advance() {
      if (advanced) return;
      advanced = true;
      detachSlot(slotCurrent);
      clearWatchdog();
      playSlot(slotOther, slotCurrent, nextIdx);
    }

    armWatchdog(slotCurrent, advance);

    if (nextIdx < PLAYLIST.length) {
      let crossfadeStarted = false;
      slotCurrent.ontimeupdate = () => {
        if (crossfadeStarted || advanced) return;
        const remaining = (slotCurrent.duration - slotCurrent.currentTime) * 1000;
        if (Number.isFinite(remaining) && remaining <= CROSSFADE_MS) {
          crossfadeStarted = true;
          slotCurrent.ontimeupdate = null;
          slotOther.src = PLAYLIST[nextIdx];
          slotOther.load();
          const startNext = () => {
            slotOther.removeEventListener('canplay', startNext);
            tryPlay(slotOther);
            slotOther.classList.add('is-active');
            slotCurrent.classList.remove('is-active');
            advanced = true;
            detachSlot(slotCurrent);
            clearWatchdog();
            playSlotContinue(slotOther, slotCurrent, nextIdx);
          };
          slotOther.addEventListener('canplay', startNext, { once: true });
        }
      };
    }

    slotCurrent.onended = advance;
    slotCurrent.onerror = (e) => {
      console.warn('[break-video] erro no vídeo, a avançar:', e);
      advance();
    };
  }

  function showPlaylist() {
    nextScheduleId = null;
    isPlaying = true;
    stage.classList.add('is-visible');
    playSlot(videoA, videoB, 0);
  }

  // Trigger manual: clique no logo força a playlist agora (se não está a tocar)
  function triggerNow() {
    if (isPlaying) return;
    clearPending();
    [videoA, videoB].forEach(v => { try { v.pause(); } catch (e) {} });
    showPlaylist();
  }

  const logoEl = document.querySelector('.h-logo');
  if (logoEl) {
    logoEl.style.cursor = 'pointer';
    logoEl.addEventListener('click', triggerNow);
  }

  // ── Agendador: dispara nos horários SCHEDULE_LISBON, em hora de Lisboa ──
  // Tolerância de 60s: se o page load acontecer entre 09:55 e 09:56, ainda dispara.

  // Devolve "HH:MM" actual em Lisboa (string ZULU-safe).
  function nowLisbon() {
    const fmt = new Intl.DateTimeFormat('pt-PT', {
      timeZone: 'Europe/Lisbon',
      hour12: false,
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit',
    });
    const parts = {};
    fmt.formatToParts(new Date()).forEach(p => { if (p.type !== 'literal') parts[p.type] = p.value; });
    return {
      // Date object representando este instante em Lisboa (mas montado como local)
      lisbonDate: new Date(`${parts.year}-${parts.month}-${parts.day}T${parts.hour}:${parts.minute}:${parts.second}`),
      h: parseInt(parts.hour, 10),
      m: parseInt(parts.minute, 10),
      s: parseInt(parts.second, 10),
    };
  }

  // Devolve { delayMs, justMissedRecent } para o próximo trigger horário.
  // Se um trigger ocorreu nos últimos 60s, dispara já (tolerância para reload).
  function nextLisbonTrigger() {
    const now = nowLisbon();
    const minutesNow = now.h * 60 + now.m + now.s / 60;
    const TOL_S = 60; // 60s de tolerância depois do horário

    // Verifica se algum horário ocorreu nos últimos 60s — se sim, dispara já
    for (const [hh, mm] of SCHEDULE_LISBON) {
      const target = hh * 60 + mm;
      const diffSec = (minutesNow - target) * 60; // segundos depois do horário
      if (diffSec >= 0 && diffSec <= TOL_S) {
        return { delayMs: 0, justMissed: true };
      }
    }

    // Caso contrário: encontra o próximo horário no futuro
    let bestDelay = Infinity;
    for (const [hh, mm] of SCHEDULE_LISBON) {
      const target = hh * 60 + mm;
      let deltaMin = target - minutesNow;
      if (deltaMin <= 0) deltaMin += 24 * 60; // amanhã
      if (deltaMin * 60 * 1000 < bestDelay) bestDelay = deltaMin * 60 * 1000;
    }
    return { delayMs: bestDelay, justMissed: false };
  }

  function scheduleNextLisbon() {
    if (nextScheduleId != null) clearTimeout(nextScheduleId);
    const { delayMs } = nextLisbonTrigger();
    nextScheduleId = setTimeout(() => {
      nextScheduleId = null;
      if (!isPlaying) showPlaylist();
      else scheduleNextLisbon(); // se ainda a tocar (improvável), tenta de novo
    }, delayMs);
  }

  scheduleNextLisbon();
})();

/* ── SYNC: prazo+details = altura do zonas-panel ── */
(function syncRightHeights() {
  const zonas = document.querySelector('.zonas-panel');
  const prazo = document.querySelector('.prazo-section');
  const details = document.querySelector('.details-section');
  if (!zonas || !prazo || !details) return;

  // box-sizing: border-box garante que height inclui padding
  prazo.style.boxSizing = 'border-box';
  details.style.boxSizing = 'border-box';

  function applyHeight() {
    const total = zonas.getBoundingClientRect().height;
    if (total <= 0) return;
    // Split: 65% prazo / 25% details — soma 90% do zonas-panel (10% libertado)
    prazo.style.height = `${total * 0.65}px`;
    details.style.height = `${total * 0.25}px`;
  }

  // Aplica imediatamente e ao redimensionar
  applyHeight();
  window.addEventListener('resize', applyHeight);
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(applyHeight).observe(zonas);
  }
})();

/* ── THREE.JS GLOBE ── */
(function() {
  const container = document.getElementById('globeContainer');
  const W = container.offsetWidth;
  const H = container.offsetHeight;

  const scene    = new THREE.Scene();
  const camera   = new THREE.PerspectiveCamera(45, W / H, 0.1, 2000);
  camera.position.set(0, 30, 380);
  camera.lookAt(0, 0, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(W, H);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
  renderer.setClearColor(0x000000, 0);
  container.appendChild(renderer.domElement);

  const RADIUS = 140 * 0.96;
  const globeGroup = new THREE.Group();
  scene.add(globeGroup);

  // Luzes (afectam apenas materiais que reagem a luz — Phong/Standard/etc.
  // O globo e a atmosfera usam BasicMaterial/ShaderMaterial, ficam intactos)
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
  dirLight.position.set(120, 180, 200);
  scene.add(dirLight);
  const fillLight = new THREE.DirectionalLight(0x88aaff, 0.35);
  fillLight.position.set(-150, -80, -100);
  scene.add(fillLight);

  // ── SHADERS ──
  const globeVS = `
    varying vec3 vNormal;
    varying vec2 vUv;
    void main() {
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
      vNormal = normalize(normalMatrix * normal);
      vUv = uv;
    }`;
  const globeFS = `
    uniform sampler2D globeTexture;
    varying vec3 vNormal;
    varying vec2 vUv;
    void main() {
      vec3 diffuse = texture2D(globeTexture, vUv).xyz * 0.8;
      float intensity = 1.05 - dot(vNormal, vec3(0.0,0.0,1.0));
      vec3 atmosphere = vec3(1.0,1.0,1.0) * pow(intensity, 3.0) * 0.4;
      gl_FragColor = vec4(diffuse + atmosphere, 1.04);
    }`;

  const atmVS = `
    varying vec3 vNormal;
    void main() {
      vNormal = normalize(normalMatrix * normal);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
    }`;
  const atmFS = `
    varying vec3 vNormal;
    void main() {
      float intensity = pow(0.7 - dot(vNormal, vec3(0.0,0.0,1.0)), 4.0);
      gl_FragColor = vec4(1.0,1.0,1.0,1.0) * intensity;
    }`;

  // ── GLOBE SPHERE with texture ──
  const loader   = new THREE.TextureLoader();
  const EARTH_TX = 'https://res.cloudinary.com/djxxk3ipz/image/upload/v1776693284/WhatsApp_Image_2025-11-16_at_11.26.19_ssekf5.jpg';

  const globeGeo = new THREE.SphereGeometry(RADIUS, 64, 64);
  const globeMat = new THREE.ShaderMaterial({
    uniforms: { globeTexture: { value: null } },
    vertexShader: globeVS,
    fragmentShader: globeFS,
    blending: THREE.AdditiveBlending,
    transparent: true,
  });

  loader.load(EARTH_TX, (tex) => {
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    globeMat.uniforms.globeTexture.value = tex;
    globeMat.needsUpdate = true;
  }, undefined, () => {
    globeMat.fragmentShader = `
      varying vec3 vNormal;
      void main() {
        float i = 1.05 - dot(vNormal, vec3(0,0,1));
        vec3 atm = vec3(0.05,0.2,0.5) * pow(i,2.5);
        gl_FragColor = vec4(vec3(0.02,0.06,0.14) + atm, 0.95);
      }`;
    globeMat.needsUpdate = true;
  });

  const globeMesh = new THREE.Mesh(globeGeo, globeMat);
  globeGroup.add(globeMesh);

  // Esfera interior escura — dá densidade visual ao globo (compensa o additive blending
  // do material principal, que tende a deixar passar o fundo). Ligeiramente menor que
  // a esfera do mapa para nunca aparecer por fora.
  const innerSphereMesh = new THREE.Mesh(
    new THREE.SphereGeometry(RADIUS * 0.985, 48, 48),
    new THREE.MeshBasicMaterial({
      color: 0x020610,        // azul-marinho muito escuro, quase preto
      transparent: true,
      opacity: 0.95,
      depthWrite: true,
    })
  );
  globeGroup.add(innerSphereMesh);

  // ── ATMOSPHERE ──
  const atmMesh = new THREE.Mesh(
    new THREE.SphereGeometry(RADIUS, 64, 64),
    new THREE.ShaderMaterial({
      vertexShader: atmVS,
      fragmentShader: atmFS,
      blending: THREE.AdditiveBlending,
      side: THREE.BackSide,
      transparent: true,
    })
  );
  atmMesh.scale.set(1.2, 1.2, 1.2);
  globeGroup.add(atmMesh);

  // ── DISC TEXTURE ──
  function makeDiscTexture() {
    const c = document.createElement('canvas');
    c.width = c.height = 64;
    const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(32,32,0,32,32,32);
    g.addColorStop(0,   'rgba(255,255,255,1)');
    g.addColorStop(0.4, 'rgba(255,255,255,0.9)');
    g.addColorStop(1,   'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(32,32,32,0,Math.PI*2); ctx.fill();
    const t = new THREE.CanvasTexture(c);
    return t;
  }

  // ── DOTS grid ──
  function toXYZ(lat, lon, r) {
    const phi   = (90 - lat)  * Math.PI / 180;
    const theta = (180 - lon) * Math.PI / 180;
    return new THREE.Vector3(
      -r * Math.sin(phi) * Math.cos(theta),
      -r * Math.cos(phi),
      -r * Math.sin(phi) * Math.sin(theta)
    );
  }

  function coordToPos(lat, lon, r) {
    const phi   = (90 - lat)  * Math.PI / 180;
    const theta = (180 - lon) * Math.PI / 180;
    return new THREE.Vector3(
      -r * Math.sin(phi) * Math.cos(theta),
       r * Math.cos(phi),
      -r * Math.sin(phi) * Math.sin(theta)
    );
  }

  const dotR   = RADIUS + RADIUS * 0.025;
  const posArr = [];
  for (let lat = -80; lat <= 80; lat += 5) {
    const cols = Math.round(Math.cos(lat * Math.PI / 180) * 36);
    for (let i = 0; i < cols; i++) {
      const lon = (i / cols) * 360 - 180;
      const p   = toXYZ(lat, lon, dotR);
      posArr.push(p.x, p.y, p.z);
    }
  }
  const dotGeo = new THREE.BufferGeometry();
  dotGeo.setAttribute('position', new THREE.Float32BufferAttribute(posArr, 3));
  const dotMat = new THREE.PointsMaterial({
    color: 0x05d5fa,
    size: 2.2,
    map: makeDiscTexture(),
    transparent: true,
    opacity: 0.8,
    alphaTest: 0.05,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  });
  globeGroup.add(new THREE.Points(dotGeo, dotMat));

  // ── MARKERS ──
  function addMarker(lat, lon, color) {
    const pos  = coordToPos(lat, lon, RADIUS + 3);
    const group = new THREE.Group();
    group.position.copy(pos);

    const mesh = new THREE.Mesh(
      new THREE.SphereGeometry(3.5, 12, 12),
      new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.95 })
    );
    group.add(mesh);

    const ring = new THREE.Mesh(
      new THREE.RingGeometry(5, 7.5, 24),
      new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.5, side: THREE.DoubleSide })
    );
    ring.lookAt(new THREE.Vector3(0,0,0));
    group.add(ring);

    globeGroup.add(group);
    return group;
  }

  // Cria a geometria de um pushpin 3D (esfera + haste cilíndrica + ponta cónica).
  // Construído com a ponta na origem, esfera ao longo de +Y. Cacheado por chave de cor.
  const PUSHPIN_CACHE = {};
  function getPushpin(headColor, shaftColor) {
    const key = `${headColor}|${shaftColor}`;
    if (PUSHPIN_CACHE[key]) return PUSHPIN_CACHE[key].clone();

    // Dimensões (proporcionais — pin discreto). RADIUS≈134, então mantemos pequeno.
    const headR = 4.5;
    const shaftLen = 9;
    const shaftR = 0.7;
    const tipLen = 1.8;

    const group = new THREE.Group();

    // Ponta (cone) — na origem, a apontar para -Y
    const tipGeo = new THREE.ConeGeometry(shaftR, tipLen, 12);
    const tipMesh = new THREE.Mesh(tipGeo, new THREE.MeshPhongMaterial({
      color: shaftColor, shininess: 80, specular: 0x666666,
    }));
    // ConeGeometry tem ponta em +Y por defeito; queremos ponta em -Y
    tipMesh.rotation.x = Math.PI;
    tipMesh.position.y = tipLen / 2;
    group.add(tipMesh);

    // Haste (cilindro)
    const shaftGeo = new THREE.CylinderGeometry(shaftR, shaftR, shaftLen, 16);
    const shaftMesh = new THREE.Mesh(shaftGeo, new THREE.MeshPhongMaterial({
      color: shaftColor, shininess: 80, specular: 0x666666,
    }));
    shaftMesh.position.y = tipLen + shaftLen / 2;
    group.add(shaftMesh);

    // Esfera (cabeça)
    const headGeo = new THREE.SphereGeometry(headR, 24, 18);
    const headMesh = new THREE.Mesh(headGeo, new THREE.MeshPhongMaterial({
      color: headColor, shininess: 50, specular: 0x222222,
    }));
    headMesh.position.y = tipLen + shaftLen + headR * 0.85; // ligeira sobreposição com a haste
    group.add(headMesh);

    PUSHPIN_CACHE[key] = group;
    return group.clone();
  }

  // Marcador em forma de pushpin 3D. A ponta fica nas coords (lat, lon)
  // e o pin orienta-se radialmente para fora (cabeça para o céu, ponta no globo).
  function add3DPinMarker(lat, lon, headColor, shaftColor) {
    const tipPos = coordToPos(lat, lon, RADIUS + 0.2);
    const outwardDir = tipPos.clone().normalize();

    const pin = getPushpin(headColor, shaftColor || '#cfd2d6');

    pin.position.copy(tipPos);
    const upLocal = new THREE.Vector3(0, 1, 0);
    pin.quaternion.setFromUnitVectors(upLocal, outwardDir);

    pin.renderOrder = 999;
    globeGroup.add(pin);
    return pin;
  }
  // Marcadores iniciais — Portugal como pushpin (esfera branca, haste cinzenta)
  let ptRing = add3DPinMarker(38.7, -9.1, '#ffffff', '#b8bcc2');
  let destRings = [];

  // Atualiza marcadores de destino. Aceita uma lista de nomes de países (ou um único string,
  // por compatibilidade com a API antiga). Países repetidos são ignorados.
  function updateGlobeDestinations(countries) {
    const list = Array.isArray(countries) ? countries : (countries ? [countries] : []);

    // Remover marcadores antigos
    destRings.forEach(g => globeGroup.remove(g));
    destRings = [];

    // Deduplicar (case-insensitive, ignorando acentos)
    const seen = new Set();
    list.forEach(name => {
      if (!name) return;
      const key = String(name).trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      if (key === '' || seen.has(key)) return;
      seen.add(key);
      const coords = getCountryCoordinates(name);
      if (!coords) return;
      destRings.push(addMarker(coords.lat, coords.lon, 0x00ff87));
    });
  }
  // Wrapper de compatibilidade — código antigo ainda chama updateGlobeDestination(country)
  function updateGlobeDestination(country) {
    updateGlobeDestinations(country);
  }
  window.updateGlobeDestinations = updateGlobeDestinations;
  window.updateGlobeDestination = updateGlobeDestination;

  // O destino do globo será atualizado a partir de renderSheetData()

  globeGroup.rotation.y = THREE.MathUtils.degToRad(-(180 - 9.1));
  globeGroup.rotation.x = THREE.MathUtils.degToRad(20);

  let isRotating    = false;
  let rotStart      = 0;
  let rotStartAngle = 0;
  const ROT_DUR     = 8000;

  setInterval(() => {
    if (isRotating) return;
    isRotating    = true;
    rotStart      = Date.now();
    rotStartAngle = globeGroup.rotation.y;
  }, 5 * 60 * 1000);

  let t = 0;
  function animate() {
    requestAnimationFrame(animate);
    t += 0.008;

    const p = 0.88 + 0.18 * Math.sin(t * 3);
    // Pin de Portugal (3D) sem animação — só os marcadores de destino pulsam
    destRings.forEach(r => r.scale.set(p, p, 1));

    if (!isRotating) globeGroup.rotation.y -= 0.0015;

    if (isRotating) {
      const elapsed  = Date.now() - rotStart;
      const progress = Math.min(elapsed / ROT_DUR, 1);
      const ease     = progress < 0.5 ? 2*progress*progress : -1+(4-2*progress)*progress;
      globeGroup.rotation.y = rotStartAngle + ease * Math.PI * 2;
      if (progress >= 1) { globeGroup.rotation.y = rotStartAngle; isRotating = false; }
    }

    renderer.render(scene, camera);
  }
  animate();

  // Resize com ResizeObserver — mais robusto do que window.resize
  // (dispara também quando o layout do grid muda, não só quando a janela muda)
  const ro = new ResizeObserver(() => {
    const W2 = container.offsetWidth, H2 = container.offsetHeight;
    if (W2 === 0 || H2 === 0) return;
    camera.aspect = W2 / H2;
    camera.updateProjectionMatrix();
    renderer.setSize(W2, H2);
  });
  ro.observe(container);
})();
</script>
</body>
</html>
